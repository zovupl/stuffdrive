<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pablo Auto Spain — Rent a Car Barcelona</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="firebase-config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#0A0A0C;
  --bg-soft:#121216;
  --card:#16161B;
  --card-2:#1D1D24;
  --line:rgba(255,255,255,0.08);
  --line-2:rgba(255,255,255,0.14);
  --text:#F5F3EE;
  --text-dim:#9C9AA3;
  --text-faint:#5F5D66;
  --amber:#E8A33D;
  --amber-soft:rgba(232,163,61,0.14);
  --amber-line:rgba(232,163,61,0.35);
  --green:#3DD68C;
  --red:#F05D45;
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --r-lg:24px;
  --r-md:16px;
  --r-sm:12px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  font-family:'Manrope',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;justify-content:center;
  overscroll-behavior:none;
}

#app{
  width:100%;max-width:430px;
  height:100vh;height:100dvh;
  position:relative;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(420px 260px at 85% -8%, rgba(232,163,61,0.10), transparent 65%),
    radial-gradient(600px 420px at 15% -12%, rgba(60,80,120,0.10), transparent 60%),
    var(--bg);
}

/* ============ HEADER ============ */
.header{
  padding:14px 18px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-shrink:0;
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;}
.brand .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--amber);
  white-space:nowrap;
}
.brand h1{
  font-size:17px;font-weight:800;letter-spacing:0.01em;
  margin:0;color:var(--text);white-space:nowrap;
}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

.lang-switch{
  display:flex;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:50px;
  padding:3px;
}
.lang-btn{
  border:none;background:transparent;
  color:var(--text-faint);
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;font-weight:600;letter-spacing:0.04em;
  padding:6px 9px;border-radius:50px;
  cursor:pointer;
  transition:all .2s;
}
.lang-btn.active{
  background:var(--amber);
  color:#141414;
}

.icon-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--bg-soft);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);cursor:pointer;
  transition:all .2s;
}
.icon-btn:active{transform:scale(0.92);background:var(--card-2);}

/* ============ DECK ============ */
.deck-wrap{
  flex:1;position:relative;
  padding:4px 16px 0;
  min-height:0;
}
.deck{position:relative;width:100%;height:100%;}
.deck-loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;
  color:var(--text-faint);
  font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.08em;
}
.spinner{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid var(--line-2);
  border-top-color:var(--amber);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.card{
  position:absolute;inset:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  overflow:hidden;
  display:flex;flex-direction:column;
  touch-action:pan-y;
  will-change:transform;
  transition:transform .38s cubic-bezier(.22,.9,.24,1), opacity .38s;
  box-shadow:0 24px 60px rgba(0,0,0,0.55);
}
.card.dragging{transition:none;}

/* ---- photo area ---- */
.ph{
  position:relative;
  height:54%;flex-shrink:0;
  background:#101014;
  overflow:hidden;
  user-select:none;
}
.ph img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .3s;
}
.ph img.on{opacity:1;}
.ph .ph-shimmer{
  position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,0.05) 50%,transparent 70%);
  background-size:250% 100%;
  animation:shim 1.4s infinite;
}
@keyframes shim{0%{background-position:120% 0}100%{background-position:-120% 0}}

.ph .scrim{
  position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(to top, rgba(10,10,12,0.92), rgba(10,10,12,0.4) 55%, transparent);
  pointer-events:none;
}
.ph .scrim-top{
  position:absolute;left:0;right:0;top:0;height:56px;
  background:linear-gradient(to bottom, rgba(10,10,12,0.55), transparent);
  pointer-events:none;
}

/* story-style progress */
.ph .segs{
  position:absolute;top:10px;left:12px;right:12px;
  display:flex;gap:4px;z-index:4;
}
.ph .seg{
  flex:1;height:2.5px;border-radius:3px;
  background:rgba(255,255,255,0.28);
  overflow:hidden;
}
.ph .seg i{
  display:block;height:100%;width:0%;
  background:#fff;border-radius:3px;
  transition:width .2s;
}
.ph .seg.done i{width:100%;}
.ph .seg.now i{width:100%;background:var(--amber);}

/* tap zones */
.ph .tz{position:absolute;top:0;bottom:0;width:34%;z-index:3;}
.ph .tz.l{left:0;}
.ph .tz.r{right:0;}

.chip-class{
  position:absolute;top:22px;right:14px;z-index:4;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--amber);
  background:rgba(10,10,12,0.55);
  border:1px solid var(--amber-line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:6px 11px;border-radius:50px;
}

.ph .title-block{
  position:absolute;left:16px;right:16px;bottom:12px;z-index:4;
  pointer-events:none;
}
.ph .title-block .nm{
  font-size:24px;font-weight:800;letter-spacing:-0.01em;
  color:#fff;line-height:1.15;
  text-shadow:0 2px 14px rgba(0,0,0,0.5);
}
.ph .title-block .sub{
  margin-top:3px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:rgba(255,255,255,0.75);
  letter-spacing:0.05em;
}

/* ---- details ---- */
.details{
  flex:1;min-height:0;
  overflow-y:auto;
  padding:16px 16px 12px;
  -webkit-overflow-scrolling:touch;
}
.spec-row{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;margin-bottom:12px;
}
.spec{
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  padding:10px 10px 9px;
  display:flex;flex-direction:column;gap:3px;
}
.spec .k{
  font-family:'JetBrains Mono',monospace;
  font-size:8.5px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-faint);
}
.spec .v{font-size:13px;font-weight:700;color:var(--text);}

.feats{display:flex;flex-wrap:wrap;gap:6px;}
.feat{
  font-size:11.5px;font-weight:600;
  color:var(--text-dim);
  background:var(--bg-soft);
  border:1px solid var(--line);
  padding:5px 11px;border-radius:50px;
}
.feat::before{
  content:'';display:inline-block;
  width:5px;height:5px;border-radius:50%;
  background:var(--amber);
  margin-right:7px;vertical-align:1.5px;
}

/* dots */
.dots{
  display:flex;justify-content:center;gap:5px;
  padding:10px 0 2px;flex-shrink:0;
}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,0.18);
  transition:all .25s;
}
.dot.active{width:18px;border-radius:3px;background:var(--amber);}

/* ============ CTA BAR ============ */
.cta-bar{
  padding:10px 16px calc(14px + var(--safe-bottom));
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
}
.price-box{display:flex;flex-direction:column;flex-shrink:0;}
.price-box .p{
  font-size:22px;font-weight:800;color:var(--text);
  letter-spacing:-0.01em;line-height:1.05;
}
.price-box .p span{color:var(--amber);}
.price-box .u{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--text-faint);
}
.book-btn{
  flex:1;border:none;
  border-radius:var(--r-md);
  background:linear-gradient(135deg,#F0B254,#DD8F2A);
  color:#161005;
  font-family:'Manrope',sans-serif;
  font-weight:800;font-size:15px;letter-spacing:0.01em;
  padding:15px 10px;
  cursor:pointer;
  box-shadow:0 8px 26px rgba(232,163,61,0.28);
  transition:transform .15s;
}
.book-btn:active{transform:scale(0.97);}

/* ============ SHEETS ============ */
.overlay{
  position:absolute;inset:0;
  background:rgba(5,5,7,0.66);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:20;
}
.overlay.show{opacity:1;pointer-events:auto;}

.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--bg-soft);
  border-top:1px solid var(--line-2);
  border-radius:26px 26px 0 0;
  padding:8px 20px calc(20px + var(--safe-bottom));
  transform:translateY(102%);
  transition:transform .34s cubic-bezier(.22,.9,.24,1);
  z-index:21;max-height:90%;
  overflow-y:auto;
  color:var(--text);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{
  width:36px;height:4px;border-radius:4px;
  background:var(--line-2);
  margin:8px auto 16px;
}
.sheet h3{font-size:19px;font-weight:800;margin:0 0 4px;}
.sheet .sub{font-size:13px;color:var(--text-dim);margin-bottom:16px;line-height:1.45;}

.field{margin-bottom:13px;}
.field label{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:6px;
}
.field input,.field textarea{
  width:100%;
  border:1.5px solid var(--line-2);
  border-radius:var(--r-sm);
  padding:13px 14px;
  font-family:'Manrope',sans-serif;font-size:15px;
  color:var(--text);
  background:var(--card);
  outline:none;
  transition:border-color .2s;
  color-scheme:dark;
}
.field input:focus,.field textarea:focus{border-color:var(--amber);}
.date-row{display:flex;gap:10px;}
.date-row .field{flex:1;}

.err{
  color:var(--red);font-size:12px;
  margin:-6px 0 10px;display:none;
}
.err.show{display:block;}

.confirm-btn{
  width:100%;border:none;
  border-radius:var(--r-md);
  background:linear-gradient(135deg,#F0B254,#DD8F2A);
  color:#161005;
  font-weight:800;font-size:15px;
  padding:15px;cursor:pointer;margin-top:2px;
  transition:transform .15s, opacity .2s;
}
.confirm-btn:active{transform:scale(0.98);}
.confirm-btn:disabled{opacity:0.55;}

/* requests */
.req-item{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:var(--r-md);
  padding:13px 14px;margin-bottom:10px;
}
.req-item .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.req-item .car{font-weight:800;font-size:14px;}
.req-item .when{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);}
.req-item .meta{font-size:12.5px;color:var(--text-dim);line-height:1.55;}
.req-empty{text-align:center;padding:34px 10px;color:var(--text-faint);font-size:13px;line-height:1.5;}
.clear-link{
  display:block;text-align:center;
  font-size:12px;color:var(--text-faint);
  margin-top:14px;text-decoration:underline;cursor:pointer;
}

/* success overlay */
#stampOverlay{
  position:absolute;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  background:rgba(5,5,7,0.8);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#stampOverlay.show{opacity:1;}
.stamp{
  text-align:center;
  transform:scale(0.7);
  transition:transform .45s cubic-bezier(.34,1.56,.64,1);
}
#stampOverlay.show .stamp{transform:scale(1);}
.stamp .ring{
  width:78px;height:78px;border-radius:50%;
  border:2.5px solid var(--green);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;
  box-shadow:0 0 40px rgba(61,214,140,0.25);
}
.stamp .t1{font-size:21px;font-weight:800;color:var(--text);}
.stamp .t2{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--text-dim);
  margin-top:6px;letter-spacing:0.06em;
}

.swipe-hint{
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:0.08em;
  color:var(--text-faint);
  padding:4px 0 2px;flex-shrink:0;
}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<div id="app">

  <div class="header">
    <div class="brand">
      <span class="eyebrow">Barcelona</span>
      <h1>PABLO AUTO SPAIN</h1>
    </div>
    <div class="header-right">
      <div class="lang-switch" id="langSwitch">
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ru">RU</button>
      </div>
      <div class="icon-btn" id="reqBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 8v4l2.5 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
    </div>
  </div>

  <div class="deck-wrap">
    <div class="deck" id="deck">
      <div class="deck-loading"><div class="spinner"></div><span id="loadingText">…</span></div>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- booking sheet -->
    <div class="sheet" id="bookingSheet">
      <div class="sheet-handle"></div>
      <h3 id="bookCarName"></h3>
      <div class="sub" id="bookCarSub"></div>
      <div class="date-row">
        <div class="field">
          <label id="lblFrom"></label>
          <input type="date" id="dateFrom">
        </div>
        <div class="field">
          <label id="lblTo"></label>
          <input type="date" id="dateTo">
        </div>
      </div>
      <div class="err" id="dateErr"></div>
      <div class="field">
        <label id="lblName"></label>
        <input type="text" id="nameInput">
      </div>
      <div class="field">
        <label id="lblPhone"></label>
        <input type="tel" id="phoneInput" placeholder="+34 …">
      </div>
      <div class="field">
        <label id="lblNote"></label>
        <textarea id="noteInput" rows="2"></textarea>
      </div>
      <div class="err" id="formErr"></div>
      <button class="confirm-btn" id="confirmBtn"></button>
    </div>

    <!-- my requests sheet -->
    <div class="sheet" id="requestsSheet">
      <div class="sheet-handle"></div>
      <h3 id="reqTitle"></h3>
      <div class="sub" id="reqSub"></div>
      <div id="reqList"></div>
      <div class="clear-link" id="clearReq"></div>
    </div>

    <div id="stampOverlay">
      <div class="stamp">
        <div class="ring">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#3DD68C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="t1" id="stampT1"></div>
        <div class="t2" id="stampT2"></div>
      </div>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <div class="swipe-hint" id="swipeHint"></div>

  <div class="cta-bar">
    <div class="price-box">
      <div class="p" id="ctaPrice"></div>
      <div class="u" id="ctaUnit"></div>
    </div>
    <button class="book-btn" id="mainBookBtn"></button>
  </div>

</div>

      dateErr:'Дата возврата должна быть позже даты получения.',
      formErr:'Укажите имя и телефон, чтобы продолжить.',
      sendErr:'Не удалось отправить. Попробуйте ещё раз.',
      ok1:'Забронировано!', ok2:'Мы скоро свяжемся с вами',
      reqTitle:'Мои заявки', reqSub:'Заявки, отправленные с этого устройства.',
      reqEmpty:'Заявок пока нет.<br>Выберите машину и забронируйте.',
      clear:'Очистить локальную историю', clearAsk:'Очистить локальную историю?',
      specs:{year:'Год',seats:'Мест',doors:'Дверей',trans:'Коробка',fuel:'Топливо',consumo:'Расход'},
      vals:{auto:'Автомат',manual:'Механика',petrol:'Бензин',diesel:'Дизель',hybrid:'Гибрид',electric:'Электро'},
      cls:{estate:'Универсал',muscle:'Спорткар',suv:'Внедорожник',compact:'Компакт',premium:'Премиум',economy:'Эконом',electric:'Электро',convertible:'Кабриолет'},
      feats:{ac:'Кондиционер',bluetooth:'Bluetooth',carplay:'CarPlay',leather:'Кожа',panorama:'Панорамная крыша',camera:'Камера заднего вида',sensors:'Парктроники',cruise:'Круиз-контроль',heated:'Подогрев сидений',keyless:'Keyless',led:'LED-фары',awd:'Полный привод','7seats':'7 мест',navi:'Навигация',usb:'USB',convertible:'Кабриолет',sport:'Спорт-режим'}
    }
  };

  const LANG_KEY = 'pas:lang';
  function detectLang(){
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) return saved;
    let code = '';
    try{ code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || ''; }catch(e){}
    code = String(code).slice(0,2).toLowerCase();
    if (code === 'ru' || code === 'uk' || code === 'be' || code === 'kk') return 'ru';
    if (code === 'es' || code === 'ca') return 'es';
    return 'en';
  }
  let lang = detectLang();
  const T = () => I18N[lang];
  const trVal  = v => (T().vals[v]  || v);
  const trCls  = v => (T().cls[v]   || v);
  const trFeat = v => (T().feats[v] || v);

  // ================= data =================
  const FB = window.FIREBASE_CONFIG || null;
  const MY_BOOKINGS_KEY = 'pas:my-bookings';

  const DEMO_CARS = [
    {id:'d1', name:'Audi A4 Avant', cls:'estate', priceperday:55, year:'2019', seats:5, doors:5, trans:'auto', fuel:'petrol', features:['ac','carplay','sensors'], photos:[]},
    {id:'d2', name:'Mini Cooper', cls:'compact', priceperday:45, year:'2018', seats:4, doors:3, trans:'auto', fuel:'petrol', features:['ac','bluetooth'], photos:[]},
  ];

  let cars = [];
  let current = 0;
  let activeBookingCar = null;
  const photoIdx = {};   // carId -> current photo index

  function fireBase(){
    return 'https://firestore.googleapis.com/v1/projects/' + FB.projectId + '/databases/(default)/documents';
  }
  function fromFv(v){
    if (v == null) return null;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return parseInt(v.integerValue,10);
    if ('doubleValue' in v) return v.doubleValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('arrayValue' in v) return (v.arrayValue.values||[]).map(fromFv);
    if ('mapValue' in v){ const o={}; const f=v.mapValue.fields||{}; for(const k in f) o[k]=fromFv(f[k]); return o; }
    return null;
  }
  function toFv(x){
    if (x === null || x === undefined) return {nullValue:null};
    if (typeof x === 'string') return {stringValue:x};
    if (typeof x === 'number') return Number.isInteger(x) ? {integerValue:String(x)} : {doubleValue:x};
    if (typeof x === 'boolean') return {booleanValue:x};
    if (Array.isArray(x)) return {arrayValue:{values:x.map(toFv)}};
    if (typeof x === 'object'){ const f={}; for(const k in x) f[k]=toFv(x[k]); return {mapValue:{fields:f}}; }
    return {nullValue:null};
  }
  function docToObj(doc){
    const o = {}; const f = doc.fields || {};
    for (const k in f) o[k] = fromFv(f[k]);
    o.id = doc.name.split('/').pop();
    return o;
  }

  async function loadFleet(){
    if (FB){
      try{
        const res = await fetch(fireBase() + '/cars?pageSize=300&key=' + FB.apiKey);
        const data = await res.json();
        if (data.documents && data.documents.length){
          const list = data.documents.map(docToObj)
            .filter(c => c.active !== false)
            .sort((a,b) => (a.order||999)-(b.order||999) || String(a.name).localeCompare(String(b.name)));
          if (list.length){ cars = list; return; }
        }
      }catch(e){}
    }
    cars = DEMO_CARS;
  }

  async function saveBooking(b){
    try{
      const mine = JSON.parse(localStorage.getItem(MY_BOOKINGS_KEY) || '[]');
      mine.unshift(b);
      localStorage.setItem(MY_BOOKINGS_KEY, JSON.stringify(mine.slice(0,50)));
    }catch(e){}
    if (FB){
      const fields = {}; for (const k in b) fields[k] = toFv(b[k]);
      const res = await fetch(fireBase() + '/bookings?key=' + FB.apiKey, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({fields})
      });
      if (!res.ok) throw new Error('firestore ' + res.status);
    }
    if (window.NOTIFY_WEBHOOK){
      try{ fetch(window.NOTIFY_WEBHOOK, {method:'POST', body: JSON.stringify({type:'booking', booking:b})}).catch(()=>{}); }catch(e){}
    }
  }

  const loadMy = () => { try{ return JSON.parse(localStorage.getItem(MY_BOOKINGS_KEY)||'[]'); }catch(e){ return []; } };
  const clearMy = () => { try{ localStorage.removeItem(MY_BOOKINGS_KEY); }catch(e){} };

  // ================= helpers =================
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ================= render =================
  const deck = $('deck'), dotsEl = $('dots');

  function photosOf(car){
    if (Array.isArray(car.photos) && car.photos.length) return car.photos;
    if (car.photo) return [car.photo];
    return [];
  }

  function specsHTML(car){
    const S = T().specs;
    const rows = [
      [S.year, car.year],
      [S.seats, car.seats],
      [S.doors, car.doors],
      [S.trans, car.trans ? trVal(car.trans) : null],
      [S.fuel, car.fuel ? trVal(car.fuel) : null],
      [S.consumo, car.consumo],
    ].filter(([,v]) => v !== undefined && v !== null && v !== '');
    return rows.map(([k,v])=>`<div class="spec"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
  }

  function segsHTML(car){
    const ph = photosOf(car);
    if (ph.length < 2) return '';
    const i = photoIdx[car.id] || 0;
    return `<div class="segs">${ph.map((_,j)=>`<div class="seg ${j<i?'done':''} ${j===i?'now':''}"><i></i></div>`).join('')}</div>`;
  }

  function photoAreaHTML(car){
    const ph = photosOf(car);
    const i = photoIdx[car.id] || 0;
    const imgs = ph.map((src,j)=>`<img src="${esc(src)}" class="${j===i?'on':''}" ${j<=i+1?'':'loading="lazy"'} alt="">`).join('');
    return `
      ${ph.length ? imgs : '<div class="ph-shimmer"></div>'}
      <div class="scrim"></div><div class="scrim-top"></div>
      ${segsHTML(car)}
      ${ph.length>1 ? '<div class="tz l" data-go="-1"></div><div class="tz r" data-go="1"></div>' : ''}
      <div class="chip-class">${esc(trCls(car.cls))}</div>
      <div class="title-block">
        <div class="nm">${esc(car.name)}</div>
        <div class="sub">${esc(car.year||'')}${car.year?' · ':''}Barcelona</div>
      </div>`;
  }

  function cardHTML(car){
    return `
      <div class="ph" data-car="${esc(car.id)}">${photoAreaHTML(car)}</div>
      <div class="details">
        <div class="spec-row">${specsHTML(car)}</div>
        <div class="feats">${(car.features||[]).map(f=>`<div class="feat">${esc(trFeat(f))}</div>`).join('')}</div>
      </div>`;
  }

  function renderDeck(){
    deck.innerHTML = '';
    cars.forEach((car,i)=>{
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.index = i;
      el.innerHTML = cardHTML(car);
      positionCard(el, i-current, false);
      deck.appendChild(el);
      attachDrag(el);
      attachPhotoNav(el, car);
    });
    renderDots();
    updateCta();
  }

  function renderDots(){
    dotsEl.innerHTML = cars.map((_,i)=>`<div class="dot ${i===current?'active':''}"></div>`).join('');
  }

  function updateCta(){
    const car = cars[current];
    if (!car) return;
    $('ctaPrice').innerHTML = '<span>€</span>' + esc(car.priceperday);
    $('ctaUnit').textContent = T().perDay;
    $('mainBookBtn').textContent = T().book;
  }

  function positionCard(el, off, animate){
    el.style.transition = animate ? '' : 'none';
    if (off === 0){
      el.style.transform = 'translateX(0) rotate(0)';
      el.style.opacity = '1'; el.style.zIndex = 5; el.style.pointerEvents = 'auto';
    } else if (off === 1 || off === -1){
      el.style.transform = `translateX(${off*20}px) scale(0.95) rotate(${off*2.5}deg)`;
      el.style.opacity = '0'; el.style.zIndex = 1; el.style.pointerEvents = 'none';
    } else {
      el.style.transform = `translateX(${off>0?420:-420}px)`;
      el.style.opacity = '0'; el.style.zIndex = 0; el.style.pointerEvents = 'none';
    }
    if (!animate){ void el.offsetWidth; el.style.transition = ''; }
  }

  function updatePositions(){
    Array.from(deck.children).forEach(el=>{
      positionCard(el, parseInt(el.dataset.index,10)-current, true);
    });
    renderDots();
    updateCta();
  }

  function goTo(i){
    if (i < 0) i = 0;
    if (i > cars.length-1) i = cars.length-1;
    if (i === current) return;
    current = i;
    haptic('light');
    updatePositions();
  }

  // ---- photo navigation (story style) ----
  function attachPhotoNav(cardEl, car){
    const phEl = cardEl.querySelector('.ph');
    if (!phEl) return;
    phEl.addEventListener('click', (e)=>{
      const tz = e.target.closest('.tz');
      if (!tz) return;
      const ph = photosOf(car);
      if (ph.length < 2) return;
      const dir = parseInt(tz.dataset.go,10);
      let i = (photoIdx[car.id]||0) + dir;
      if (i < 0) i = ph.length - 1;
      if (i >= ph.length) i = 0;
      photoIdx[car.id] = i;
      haptic('light');
      phEl.innerHTML = photoAreaHTML(car);
    });
  }

  // ---- drag / swipe between cars ----
  function attachDrag(el){
    let sx=0, sy=0, dx=0, drag=false, dec=false, hz=false;
    const down = e => {
      if (parseInt(el.dataset.index,10) !== current) return;
      drag = true; dec = false; hz = false;
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY; dx = 0;
      el.classList.add('dragging');
    };
    const move = e => {
      if (!drag) return;
      const p = e.touches ? e.touches[0] : e;
      dx = p.clientX - sx;
      const dy = p.clientY - sy;
      if (!dec && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){ hz = Math.abs(dx) > Math.abs(dy); dec = true; }
      if (hz){
        if (e.cancelable) e.preventDefault();
        el.style.transform = `translateX(${dx}px) rotate(${dx/24}deg)`;
      }
    };
    const up = () => {
      if (!drag) return;
      drag = false;
      el.classList.remove('dragging');
      if (hz && Math.abs(dx) > 70){
        if (dx < 0 && current < cars.length-1) goTo(current+1);
        else if (dx > 0 && current > 0) goTo(current-1);
        else updatePositions();
      } else updatePositions();
    };
    el.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, {passive:true});
    el.addEventListener('touchmove', move, {passive:false});
    el.addEventListener('touchend', up);
  }

  // ================= sheets =================
  const overlay = $('overlay'), bookingSheet = $('bookingSheet'), requestsSheet = $('requestsSheet'), stampOverlay = $('stampOverlay');
  const openSheet = s => { overlay.classList.add('show'); s.classList.add('show'); };
  const closeSheets = () => { overlay.classList.remove('show'); bookingSheet.classList.remove('show'); requestsSheet.classList.remove('show'); };
  overlay.addEventListener('click', closeSheets);

  const todayStr = () => new Date().toISOString().slice(0,10);

  $('mainBookBtn').addEventListener('click', ()=>{
    if (!cars.length) return;
    activeBookingCar = cars[current];
    $('bookCarName').textContent = T().bookTitle(activeBookingCar.name);
    $('bookCarSub').textContent = T().bookSub(activeBookingCar.priceperday);
    const from = $('dateFrom'), to = $('dateTo');
    from.min = todayStr(); to.min = todayStr();
    if (!from.value) from.value = todayStr();
    $('dateErr').classList.remove('show');
    $('formErr').classList.remove('show');
    let pre = '';
    try{ pre = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || ''; }catch(e){}
    if (pre && !$('nameInput').value) $('nameInput').value = pre;
    haptic('medium');
    openSheet(bookingSheet);
  });

  $('confirmBtn').addEventListener('click', async ()=>{
    const from = $('dateFrom').value, to = $('dateTo').value;
    const name = $('nameInput').value.trim(), phone = $('phoneInput').value.trim(), note = $('noteInput').value.trim();
    const dateErr = $('dateErr'), formErr = $('formErr');
    dateErr.classList.remove('show'); formErr.classList.remove('show');
    formErr.textContent = T().formErr;

    if (!from || !to || new Date(to) <= new Date(from)){ dateErr.classList.add('show'); return; }
    if (!name || !phone){ formErr.classList.add('show'); return; }

    const btn = $('confirmBtn');
    btn.disabled = true; btn.textContent = T().sending;

    let tgUser = null, tgUserId = null;
    try{
      const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u){ tgUser = u.username || null; tgUserId = u.id || null; }
    }catch(e){}

    const booking = {
      bookingId: 'bk_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      carId: activeBookingCar.id,
      carName: activeBookingCar.name,
      priceperday: activeBookingCar.priceperday,
      from, to, name, phone, note,
      createdAt: new Date().toISOString(),
      tgUser, tgUserId,
      status: 'new',
      lang,
    };

    try{
      await saveBooking(booking);
      notifyH('success');
      closeSheets();
      stampOverlay.classList.add('show');
      setTimeout(()=>stampOverlay.classList.remove('show'), 1900);
      $('noteInput').value = '';
    }catch(e){
      notifyH('error');
      formErr.textContent = T().sendErr;
      formErr.classList.add('show');
    }finally{
      btn.disabled = false; btn.textContent = T().confirm;
    }
  });

  $('reqBtn').addEventListener('click', ()=>{
    haptic('light');
    renderRequests();
    openSheet(requestsSheet);
  });

  function renderRequests(){
    const list = $('reqList');
    const items = loadMy();
    if (!items.length){ list.innerHTML = `<div class="req-empty">${T().reqEmpty}</div>`; return; }
    const locale = lang === 'ru' ? 'ru-RU' : (lang === 'es' ? 'es-ES' : 'en-GB');
    list.innerHTML = items.map(b=>`
      <div class="req-item">
        <div class="top">
          <div class="car">${esc(b.carName)}</div>
          <div class="when">${new Date(b.createdAt).toLocaleDateString(locale,{day:'2-digit',month:'short'})}</div>
        </div>
        <div class="meta">
          ${esc(b.from)} → ${esc(b.to)} · €${esc(b.priceperday)}<br>
          ${esc(b.name)} · ${esc(b.phone)}
          ${b.note ? '<br>«'+esc(b.note)+'»' : ''}
        </div>
      </div>`).join('');
  }

  $('clearReq').addEventListener('click', ()=>{
    const doClear = () => { clearMy(); renderRequests(); };
    if (tg && tg.showConfirm){
      try{ tg.showConfirm(T().clearAsk, ok => { if (ok) doClear(); }); return; }catch(e){}
    }
    if (confirm(T().clearAsk)) doClear();
  });

  // ================= language =================
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
    $('loadingText').textContent = T().loading;
    $('swipeHint').textContent = T().swipe;
    $('lblFrom').textContent = T().from;
    $('lblTo').textContent = T().to;
    $('lblName').textContent = T().name;
    $('lblPhone').textContent = T().phone;
    $('lblNote').textContent = T().note;
    $('noteInput').placeholder = T().notePh;
    $('confirmBtn').textContent = T().confirm;
    $('reqTitle').textContent = T().reqTitle;
    $('reqSub').textContent = T().reqSub;
    $('clearReq').textContent = T().clear;
    $('stampT1').textContent = T().ok1;
    $('stampT2').textContent = T().ok2;
    if (cars.length) renderDeck();
  }

  $('langSwitch').addEventListener('click', e=>{
    const b = e.target.closest('.lang-btn');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    localStorage.setItem(LANG_KEY, lang);
    haptic('light');
    applyLang();
  });

  // ================= keyboard (desktop) =================
  window.addEventListener('keydown', e=>{
    if (e.key === 'ArrowRight') goTo(current+1);
    if (e.key === 'ArrowLeft') goTo(current-1);
  });

  // ================= init =================
  applyLang();
  (async function init(){
    await loadFleet();
    renderDeck();
  })();

})();
</script>
</body>
</html>
