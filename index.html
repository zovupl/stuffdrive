<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StuffDrive — Rent a Car Barcelona</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --bg:#0E0E12;
  --bg-soft:#17171C;
  --card:#1A1A20;
  --card-2:#232329;
  --line:rgba(255,255,255,0.08);
  --line-2:rgba(255,255,255,0.16);
  --text:#F4F3F0;
  --text-dim:#9C9AA3;
  --text-faint:#67656E;
  --amber:#E8A33D;
  --amber-dark:#161005;
  --green:#3DD68C;
  --red:#F05D45;
  --scrim:rgba(8,8,10,0.92);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"]{
  --bg:#F2F2F7;
  --bg-soft:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F2F2F7;
  --line:rgba(0,0,0,0.07);
  --line-2:rgba(0,0,0,0.14);
  --text:#1B1B20;
  --text-dim:#6E6E76;
  --text-faint:#9A9AA2;
  --scrim:rgba(8,8,10,0.88);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;justify-content:center;
  overscroll-behavior:none;
  transition:background .25s;
}

#app{
  width:100%;max-width:430px;
  height:100vh;height:100dvh;
  position:relative;
  display:flex;flex-direction:column;
  overflow:hidden;
}
body.tg #app{height:var(--tg-viewport-stable-height,100dvh);}

/* ============ HEADER ============ */
.header{
  padding:12px 14px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  flex-shrink:0;
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;}
.brand .eyebrow{
  font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--amber);white-space:nowrap;
}
.brand h1{
  font-size:16px;font-weight:800;letter-spacing:0.02em;
  margin:0;color:var(--text);white-space:nowrap;
}
.header-right{display:flex;align-items:center;gap:7px;flex-shrink:0;}

.lang-switch{
  display:flex;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:50px;
  padding:2.5px;
}
.lang-btn{
  border:none;background:transparent;
  color:var(--text-faint);
  font-family:inherit;
  font-size:10.5px;font-weight:700;
  padding:6px 8px;border-radius:50px;
  cursor:pointer;transition:all .2s;
}
.lang-btn.active{background:var(--amber);color:var(--amber-dark);}

.icon-btn{
  width:34px;height:34px;border-radius:50%;
  background:var(--bg-soft);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);cursor:pointer;
  transition:transform .15s;
  flex-shrink:0;
}
.icon-btn:active{transform:scale(0.9);}

.my-badge{
  display:flex;align-items:center;gap:5px;
  height:34px;padding:0 11px;border-radius:50px;
  background:rgba(232,163,61,0.14);
  border:1px solid rgba(232,163,61,0.45);
  color:var(--amber);
  font-family:inherit;font-size:12.5px;font-weight:800;
  cursor:pointer;transition:transform .15s;flex-shrink:0;
}
.my-badge:active{transform:scale(0.92);}

/* admin panel */
.atabs{display:flex;gap:7px;margin-bottom:14px;}
.atab{
  flex:1;border:1px solid var(--line-2);background:var(--card);
  color:var(--text-dim);font-family:inherit;font-size:13px;font-weight:700;
  border-radius:50px;padding:9px 0;cursor:pointer;transition:all .15s;
}
.atab.active{background:var(--amber);border-color:var(--amber);color:var(--amber-dark);}
.acar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);background:var(--card);
  border-radius:14px;padding:12px 13px;margin-bottom:9px;
}
.acar.inactive{opacity:0.55;}
.acar .an{font-size:14px;font-weight:800;}
.acar .as{font-size:11.5px;font-weight:600;color:var(--text-dim);margin-top:2px;}
.acar-r{display:flex;gap:6px;flex-shrink:0;}
.abtn{
  border:1px solid var(--line-2);background:var(--card-2);
  color:var(--text);font-family:inherit;font-size:12px;font-weight:700;
  border-radius:10px;padding:8px 11px;cursor:pointer;transition:transform .12s;
}
.abtn:active{transform:scale(0.93);}
.abtn.danger{color:var(--red);border-color:rgba(240,93,69,0.4);}
.abtn.good{color:var(--green);border-color:rgba(61,214,140,0.4);}
.aprice-row{display:flex;gap:7px;margin:-3px 0 9px;}
.aprice-row input{
  flex:1;border:1.5px solid var(--line-2);border-radius:10px;
  padding:9px 12px;font-family:inherit;font-size:14px;
  color:var(--text);background:var(--card);outline:none;
}
.aprice-row input:focus{border-color:var(--amber);}
.astatus{font-size:11px;font-weight:700;padding:3px 8px;border-radius:50px;}
.astatus.new{color:var(--amber);background:rgba(232,163,61,0.13);}
.aloading{text-align:center;padding:26px;color:var(--text-faint);font-size:13px;}

/* ============ DECK ============ */
.deck-wrap{flex:1;position:relative;padding:2px 14px 0;min-height:0;}
.deck{position:relative;width:100%;height:100%;}
.deck-loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;
  color:var(--text-faint);font-size:12px;font-weight:600;letter-spacing:0.06em;
}
.spinner{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid var(--line-2);
  border-top-color:var(--amber);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.card{
  position:absolute;inset:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  display:flex;flex-direction:column;
  touch-action:pan-y;
  will-change:transform;
  transition:transform .38s cubic-bezier(.22,.9,.24,1), opacity .38s;
  box-shadow:0 18px 48px rgba(0,0,0,0.4);
}
:root[data-theme="light"] .card{box-shadow:0 14px 40px rgba(0,0,0,0.14);}
.card.dragging{transition:none;}

/* ---- photo area ---- */
.ph{
  position:relative;height:52%;flex-shrink:0;
  background:#101014;overflow:hidden;user-select:none;
  cursor:pointer;
}
.ph .bgimg{
  position:absolute;inset:-24px;
  width:calc(100% + 48px);height:calc(100% + 48px);
  object-fit:cover;
  filter:blur(22px) brightness(0.72) saturate(1.15);
}
.ph .fgimg{
  position:absolute;inset:0;z-index:1;
  width:100%;height:100%;object-fit:contain;object-position:center;
  opacity:0;transition:opacity .28s;
}
.ph .fgimg.on{opacity:1;}
.ph .scrim{
  position:absolute;left:0;right:0;bottom:0;height:42%;z-index:2;
  background:linear-gradient(to top, var(--scrim), transparent);
  pointer-events:none;
}
.ph .scrim-top{
  position:absolute;left:0;right:0;top:0;height:52px;z-index:2;
  background:linear-gradient(to bottom, rgba(8,8,10,0.5), transparent);
  pointer-events:none;
}
.ph .segs{position:absolute;top:9px;left:12px;right:12px;display:flex;gap:4px;z-index:4;}
.ph .seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,0.3);overflow:hidden;}
.ph .seg i{display:block;height:100%;width:0%;background:#fff;border-radius:3px;}
.ph .seg.done i{width:100%;}
.ph .seg.now i{width:100%;background:var(--amber);}
.ph .tz{position:absolute;top:0;bottom:0;width:50%;z-index:3;}
.ph .tz.l{left:0;}
.ph .tz.r{right:0;}

.chip-class{
  position:absolute;top:20px;right:12px;z-index:4;
  font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--amber);
  background:rgba(10,10,12,0.6);
  border:1px solid rgba(232,163,61,0.4);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:5px 10px;border-radius:50px;
}
.chip-disc{
  position:absolute;top:20px;left:12px;z-index:4;
  font-size:10.5px;font-weight:800;letter-spacing:0.04em;
  color:#fff;
  background:rgba(240,93,69,0.92);
  padding:5px 9px;border-radius:50px;
}
.ph .title-block{position:absolute;left:14px;right:14px;bottom:10px;z-index:4;pointer-events:none;}
.ph .title-block .nm{
  font-size:22px;font-weight:800;letter-spacing:-0.01em;
  color:#fff;line-height:1.15;
  text-shadow:0 2px 12px rgba(0,0,0,0.55);
}
.ph .title-block .sub{
  margin-top:2px;font-size:11.5px;font-weight:600;
  color:rgba(255,255,255,0.8);
}
.ph .cam-hint{
  position:absolute;bottom:12px;right:12px;z-index:4;
  display:flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:700;
  color:rgba(255,255,255,0.85);
  background:rgba(10,10,12,0.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:4px 9px;border-radius:50px;
  pointer-events:none;
}

/* car nav arrows */
.nav-arrow{
  position:absolute;top:26%;z-index:6;
  width:32px;height:32px;border-radius:50%;
  background:rgba(14,14,18,0.55);
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;
  transition:opacity .2s, transform .15s;
}
.nav-arrow:active{transform:scale(0.88);}
.nav-arrow.l{left:6px;}
.nav-arrow.r{right:6px;}
.nav-arrow.off{opacity:0;pointer-events:none;}

/* ---- details ---- */
.details{
  flex:1;min-height:0;overflow-y:auto;
  padding:14px 14px 12px;
  -webkit-overflow-scrolling:touch;
}
.spec-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px;}
.spec{
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px 9px 8px;
  display:flex;flex-direction:column;gap:2px;
}
.spec .k{font-size:9px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-faint);}
.spec .v{font-size:12.5px;font-weight:700;color:var(--text);}
.feats{display:flex;flex-wrap:wrap;gap:6px;}
.feat{
  font-size:11.5px;font-weight:600;color:var(--text-dim);
  background:var(--card-2);
  border:1px solid var(--line);
  padding:5px 10px;border-radius:50px;
}
.feat::before{
  content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--amber);margin-right:6px;vertical-align:1.5px;
}

/* dots */
.dots{display:flex;justify-content:center;gap:5px;padding:9px 0 4px;flex-shrink:0;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line-2);transition:all .25s;}
.dot.active{width:18px;border-radius:3px;background:var(--amber);}

/* ============ CTA (browser fallback) ============ */
.cta-bar{
  padding:9px 14px calc(12px + var(--safe-bottom));
  display:none;align-items:center;gap:12px;flex-shrink:0;
}
body:not(.tg) .cta-bar{display:flex;}
.price-box{display:flex;flex-direction:column;flex-shrink:0;}
.price-box .p{font-size:21px;font-weight:800;line-height:1.05;}
.price-box .p span{color:var(--amber);}
.price-box .p s{font-size:13px;font-weight:700;color:var(--text-faint);margin-left:4px;}
.price-box .u{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);}
.book-btn{
  flex:1;border:none;border-radius:14px;
  background:linear-gradient(135deg,#F0B254,#DD8F2A);
  color:var(--amber-dark);
  font-family:inherit;font-weight:800;font-size:15px;
  padding:15px 10px;cursor:pointer;
  box-shadow:0 8px 24px rgba(232,163,61,0.26);
  transition:transform .15s;
}
.book-btn:active{transform:scale(0.97);}
body.tg .dots{padding-bottom:calc(10px + var(--safe-bottom));}

/* ============ SHEETS ============ */
.overlay{
  position:absolute;inset:0;z-index:20;
  background:rgba(5,5,7,0.6);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:21;
  background:var(--bg-soft);
  border-top:1px solid var(--line-2);
  border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + var(--safe-bottom));
  transform:translateY(103%);
  visibility:hidden;
  transition:transform .34s cubic-bezier(.22,.9,.24,1), visibility 0s linear .34s;
  max-height:92%;overflow-y:auto;color:var(--text);
}
.sheet.show{transform:translateY(0);visibility:visible;transition:transform .34s cubic-bezier(.22,.9,.24,1);}
.sheet-handle{width:36px;height:4px;border-radius:4px;background:var(--line-2);margin:8px auto 14px;}
.sheet h3{font-size:18px;font-weight:800;margin:0 0 12px;}

.book-car-row{
  display:flex;align-items:center;gap:11px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;padding:9px;margin-bottom:14px;
}
.book-car-row img{width:64px;height:48px;object-fit:cover;border-radius:9px;background:#101014;}
.book-car-row .bi{min-width:0;}
.book-car-row .bn{font-size:14.5px;font-weight:800;}
.book-car-row .bp{font-size:12px;font-weight:600;color:var(--text-dim);margin-top:1px;}
.book-car-row .bp s{color:var(--text-faint);}
.book-car-row .bp b{color:var(--red);}

.field{margin-bottom:12px;}
.field label{
  display:block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:5px;
}
.field input,.field textarea{
  width:100%;
  border:1.5px solid var(--line-2);
  border-radius:12px;
  padding:12px 13px;
  font-family:inherit;font-size:15px;
  color:var(--text);background:var(--card);
  outline:none;transition:border-color .2s;
}
:root[data-theme="dark"] .field input,
:root[data-theme="dark"] .field textarea{color-scheme:dark;}
.field input:focus,.field textarea:focus{border-color:var(--amber);}
.date-row{display:flex;gap:9px;}
.date-row .field{flex:1;}

.quick-days{display:flex;gap:6px;margin:-4px 0 12px;}
.qd{
  flex:1;border:1px solid var(--line-2);background:var(--card);
  color:var(--text-dim);
  font-family:inherit;font-size:12px;font-weight:700;
  border-radius:50px;padding:7px 0;cursor:pointer;transition:all .15s;
}
.qd.active{background:var(--amber);border-color:var(--amber);color:var(--amber-dark);}

.total-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);
  border:1px dashed var(--line-2);
  border-radius:12px;
  padding:11px 14px;margin-bottom:13px;
}
.total-row .tl{font-size:12.5px;font-weight:600;color:var(--text-dim);}
.total-row .tv{font-size:17px;font-weight:800;}
.total-row .tv span{color:var(--amber);}

.err{color:var(--red);font-size:12px;font-weight:600;margin:-4px 0 10px;display:none;}
.err.show{display:block;}

.confirm-btn{
  width:100%;border:none;border-radius:14px;
  background:linear-gradient(135deg,#F0B254,#DD8F2A);
  color:var(--amber-dark);
  font-family:inherit;font-weight:800;font-size:15px;
  padding:15px;cursor:pointer;margin-top:2px;
  transition:transform .15s, opacity .2s;
}
.confirm-btn:active{transform:scale(0.98);}
.confirm-btn:disabled{opacity:0.55;}

.req-item{
  border:1px solid var(--line);background:var(--card);
  border-radius:14px;padding:12px 13px;margin-bottom:9px;
}
.req-item .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.req-item .car{font-weight:800;font-size:14px;}
.req-item .when{font-size:11px;font-weight:600;color:var(--text-faint);}
.req-item .meta{font-size:12.5px;color:var(--text-dim);line-height:1.55;}
.req-empty{text-align:center;padding:32px 10px;color:var(--text-faint);font-size:13px;line-height:1.5;}
.sheet .sub{font-size:12.5px;color:var(--text-dim);margin:-6px 0 14px;}
.clear-link{display:block;text-align:center;font-size:12px;color:var(--text-faint);margin-top:12px;text-decoration:underline;cursor:pointer;}

/* success overlay */
#stampOverlay{
  position:absolute;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  background:rgba(5,5,7,0.78);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#stampOverlay.show{opacity:1;}
.stamp{text-align:center;transform:scale(0.7);transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
#stampOverlay.show .stamp{transform:scale(1);}
.stamp .ring{
  width:76px;height:76px;border-radius:50%;
  border:2.5px solid var(--green);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 15px;
  box-shadow:0 0 40px rgba(61,214,140,0.25);
}
.stamp .t1{font-size:20px;font-weight:800;color:#fff;}
.stamp .t2{font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);margin-top:5px;}

/* onboarding hint */
#hintOverlay{
  position:absolute;inset:0;z-index:15;
  display:none;align-items:center;justify-content:center;
  background:rgba(5,5,7,0.72);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border-radius:20px;
}
#hintOverlay.show{display:flex;}
.hint-box{text-align:center;padding:20px;color:#fff;}
.hint-line{display:flex;align-items:center;gap:12px;margin-bottom:18px;text-align:left;}
.hint-ic{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.22);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
}
.hint-tx{font-size:13.5px;font-weight:600;line-height:1.4;color:rgba(255,255,255,0.92);}
.hint-ok{
  border:none;border-radius:50px;
  background:var(--amber);color:var(--amber-dark);
  font-family:inherit;font-weight:800;font-size:14px;
  padding:11px 34px;cursor:pointer;margin-top:4px;
}

/* ============ CALENDAR PICKER ============ */
.sel-row{display:flex;gap:8px;margin-bottom:10px;}
.sel{flex:1;background:var(--card);border:1.5px solid var(--line-2);border-radius:12px;padding:8px 12px;transition:border-color .2s;}
.sel.on{border-color:var(--amber);}
.sel .k{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);}
.sel .v{font-size:14px;font-weight:800;margin-top:2px;}
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 8px;margin-bottom:10px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 2px;}
.cal-head .m{font-size:14px;font-weight:800;text-transform:capitalize;}
.cal-nav{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:var(--card-2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;font-size:18px;line-height:1;padding:0 0 2px;}
.cal-nav:disabled{opacity:.3;}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px;}
.cal-wd span{text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;}
.cal-d{position:relative;height:36px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;border-radius:10px;user-select:none;}
.cal-d.empty{cursor:default;}
.cal-d.past{color:var(--text-faint);opacity:.4;cursor:default;}
.cal-d.busy{color:var(--text-faint);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(240,93,69,.14) 3px 5px);}
.cal-d.busy::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--red);}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--line-2);}
.cal-d.in{background:rgba(232,163,61,.16);border-radius:0;}
.cal-d.from,.cal-d.to{background:var(--amber);color:var(--amber-dark);font-weight:800;border-radius:10px;box-shadow:none;}
.cal-d.from.in{border-radius:10px 0 0 10px;}
.cal-d.to.in{border-radius:0 10px 10px 0;}
.cal-legend{display:flex;gap:14px;margin-top:8px;padding:0 3px;font-size:10.5px;font-weight:600;color:var(--text-faint);}
.cal-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

/* statuses / actions */
.st{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:50px;white-space:nowrap;}
.st.new{color:var(--amber);background:rgba(232,163,61,.13);}
.st.confirmed{color:var(--green);background:rgba(61,214,140,.13);}
.st.cancelled{color:var(--red);background:rgba(240,93,69,.13);}
.st.past{color:var(--text-faint);background:var(--card-2);}
.req-item.cancelled .car,.req-item.cancelled .meta{opacity:.55;}
.req-item .top{gap:8px;}
.req-actions{display:flex;gap:7px;margin-top:9px;}
.rbtn{flex:1;border:1px solid var(--line-2);background:var(--card-2);color:var(--text);font-family:inherit;font-size:12px;font-weight:700;border-radius:10px;padding:8px 10px;cursor:pointer;transition:transform .12s;}
.rbtn:active{transform:scale(.95);}
.rbtn:disabled{opacity:.5;}
.rbtn.danger{color:var(--red);border-color:rgba(240,93,69,.4);}
.rbtn.good{color:var(--green);border-color:rgba(61,214,140,.4);}
.busy-line{margin-top:11px;font-size:11.5px;font-weight:600;color:var(--text-dim);display:flex;gap:6px;align-items:flex-start;line-height:1.4;}
.chip-busy{position:absolute;top:52px;right:12px;z-index:4;font-size:10px;font-weight:800;letter-spacing:.02em;color:#fff;background:rgba(14,14,18,.72);border:1px solid rgba(240,93,69,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px 9px;border-radius:50px;}
.afilter{display:flex;gap:6px;margin:-4px 0 10px;}
.afilter .qd{padding:6px 0;}
.arefresh{font-size:12px;color:var(--text-faint);text-align:center;margin-top:8px;text-decoration:underline;cursor:pointer;}

/* info sheet */
.info-h{font-size:14px;font-weight:800;margin:14px 0 7px;}
.info-h:first-child{margin-top:0;}
.info-p{font-size:13px;line-height:1.5;color:var(--text-dim);margin:0 0 7px;}
.info-p b{color:var(--text);}
.step{display:flex;gap:10px;margin-bottom:9px;}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--amber-dark);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step .t{font-size:13px;line-height:1.45;color:var(--text-dim);}
.step .t b{color:var(--text);}
.rule{display:flex;gap:9px;margin-bottom:7px;font-size:13px;line-height:1.45;color:var(--text-dim);}
.rule .ic{flex-shrink:0;}
.rule b{color:var(--text);}
.svc{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;}
.svc .ic{font-size:21px;line-height:1.1;flex-shrink:0;}
.svc .sn{font-size:13.5px;font-weight:800;}
.svc .sd{font-size:12px;color:var(--text-dim);line-height:1.45;margin-top:2px;}
.link-btn{display:block;text-align:center;border:1px solid rgba(232,163,61,.5);background:rgba(232,163,61,.12);color:var(--amber);text-decoration:none;font-size:13px;font-weight:800;border-radius:12px;padding:12px;margin-top:12px;}

/* toast */
.toast{position:absolute;left:14px;right:14px;bottom:calc(16px + var(--safe-bottom));z-index:40;background:var(--text);color:var(--bg);font-size:13px;font-weight:700;padding:11px 14px;border-radius:12px;text-align:center;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:none;}

::-webkit-scrollbar{width:0;height:0;}
</style>

  const LANG_KEY = 'pas:lang';
  function detectLang(){
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) return saved;
    let code = '';
    try{ code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || ''; }catch(e){}
    code = String(code).slice(0,2).toLowerCase();
    if (['ru','uk','be','kk'].includes(code)) return 'ru';
    if (['es','ca'].includes(code)) return 'es';
    return 'en';
  }
  let lang = detectLang();
  const T = () => I18N[lang];
  const trVal  = v => (T().vals[v]  || v);
  const trCls  = v => (T().cls[v]   || v);
  const trFeat = v => (T().feats[v] || v);

  // ================= theme =================
  const THEME_KEY = 'pas:theme';
  function detectTheme(){
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') return saved;
    try{ if (tg && tg.colorScheme === 'light') return 'light'; }catch(e){}
    return 'dark';
  }
  let theme = detectTheme();
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', theme);
    const dk = theme === 'dark';
    document.getElementById('iconMoon').style.display = dk ? '' : 'none';
    document.getElementById('iconSun').style.display  = dk ? 'none' : '';
    try{
      tg && tg.setHeaderColor && tg.setHeaderColor(dk ? '#0E0E12' : '#F2F2F7');
      tg && tg.setBackgroundColor && tg.setBackgroundColor(dk ? '#0E0E12' : '#F2F2F7');
    }catch(e){}
  }
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, theme);
    haptic('light');
    applyTheme();
  });

  // ================= data =================
  const FB = window.FIREBASE_CONFIG || null;
  const MY_BOOKINGS_KEY = 'pas:my-bookings';

  const DEMO_CARS = [
    {id:'d1', name:'Audi A4 Avant', cls:'estate', priceperday:55, year:'2020', seats:5, doors:5, trans:'auto', fuel:'diesel', features:['ac','leather','navi'], photos:[]},
  ];

  let cars = [];
  let allCars = [];   // включая скрытые — для админ-панели
  let busy = {};      // carId -> [{from,to}] занятые даты (публичная коллекция availability)
  let current = 0;
  let activeBookingCar = null;
  let isAdmin = false;
  const photoIdx = {};

  function fireBase(){
    return 'https://firestore.googleapis.com/v1/projects/' + FB.projectId + '/databases/(default)/documents';
  }
  function fromFv(v){
    if (v == null) return null;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return parseInt(v.integerValue,10);
    if ('doubleValue' in v) return v.doubleValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('arrayValue' in v) return (v.arrayValue.values||[]).map(fromFv);
    if ('mapValue' in v){ const o={}; const f=v.mapValue.fields||{}; for(const k in f) o[k]=fromFv(f[k]); return o; }
    return null;
  }
  function toFv(x){
    if (x === null || x === undefined) return {nullValue:null};
    if (typeof x === 'string') return {stringValue:x};
    if (typeof x === 'number') return Number.isInteger(x) ? {integerValue:String(x)} : {doubleValue:x};
    if (typeof x === 'boolean') return {booleanValue:x};
    if (Array.isArray(x)) return {arrayValue:{values:x.map(toFv)}};
    if (typeof x === 'object'){ const f={}; for(const k in x) f[k]=toFv(x[k]); return {mapValue:{fields:f}}; }
    return {nullValue:null};
  }
  function docToObj(doc){
    const o = {}; const f = doc.fields || {};
    for (const k in f) o[k] = fromFv(f[k]);
    o.id = doc.name.split('/').pop();
    return o;
  }

  async function loadFleet(){
    if (FB){
      try{
        const res = await fetch(fireBase() + '/cars?pageSize=300&key=' + FB.apiKey);
        const data = await res.json();
        if (data.documents && data.documents.length){
          allCars = data.documents.map(docToObj)
            .sort((a,b) => (a.order||999)-(b.order||999) || String(a.name).localeCompare(String(b.name)));
          const list = allCars.filter(c => c.active !== false);
          if (list.length){ cars = list; return; }
        }
      }catch(e){}
    }
    cars = DEMO_CARS;
    allCars = DEMO_CARS;
  }

  // занятые даты всех машин — только интервалы, без личных данных
  async function loadAvailability(){
    if (!FB) return;
    try{
      const res = await fetch(fireBase() + '/availability?pageSize=300&key=' + FB.apiKey, {cache:'no-store'});
      const data = await res.json();
      const map = {};
      (data.documents||[]).forEach(d=>{
        const o = docToObj(d);
        map[o.id] = (o.ranges||[]).filter(r=>r && r.from && r.to);
      });
      busy = map;
    }catch(e){}
  }

  // запрос к серверу (Apps Script): создание брони, статусы, отмена, админ-операции
  async function apiPost(payload){
    if (!window.NOTIFY_WEBHOOK) return null;
    const res = await fetch(window.NOTIFY_WEBHOOK, {method:'POST', body: JSON.stringify(payload)});
    return await res.json();
  }

  const loadMy = () => { try{ return JSON.parse(localStorage.getItem(MY_BOOKINGS_KEY)||'[]'); }catch(e){ return []; } };
  const storeMy = list => { try{ localStorage.setItem(MY_BOOKINGS_KEY, JSON.stringify(list.slice(0,50))); }catch(e){} };
  const clearMy = () => { try{ localStorage.removeItem(MY_BOOKINGS_KEY); }catch(e){} };
  function addMy(b){ const l = loadMy(); l.unshift(b); storeMy(l); }
  function mergeMy(updates){ // обновить статусы своих броней данными с сервера
    const l = loadMy();
    updates.forEach(u=>{ const i = l.findIndex(x=>x.bookingId===u.bookingId); if (i>=0) l[i] = Object.assign({}, l[i], u); });
    storeMy(l);
  }

  // ================= helpers =================
  const $ = id => document.getElementById(id);
  const setTxt = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad2 = n => (n<10?'0':'')+n;
  const ymd = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  const parseD = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
  const todayStr = () => ymd(new Date());
  const addDays = (dstr, n) => { const d = parseD(dstr); d.setDate(d.getDate()+n); return ymd(d); };
  const daysBetween = (a,b) => Math.round((parseD(b) - parseD(a)) / 86400000);
  const locale = () => lang === 'ru' ? 'ru-RU' : (lang === 'es' ? 'es-ES' : 'en-GB');
  const fmtD = s => s ? parseD(s).toLocaleDateString(locale(), {day:'numeric', month:'short'}) : '—';
  const fmtRange = (a,b) => fmtD(a) + ' → ' + fmtD(b);
  const isBusy = (carId, d) => (busy[carId]||[]).some(r => r.from <= d && d <= r.to);
  const rangeFree = (carId, a, b) => !(busy[carId]||[]).some(r => a <= r.to && r.from <= b);
  const upcomingBusy = carId => (busy[carId]||[]).filter(r => r.to >= todayStr()).sort((x,y)=>x.from.localeCompare(y.from));
  const statusOf = b => b.status === 'cancelled' ? 'cancelled' : (b.to && b.to < todayStr() ? 'past' : (b.status === 'confirmed' ? 'confirmed' : 'new'));
  const statusText = st => st === 'confirmed' ? T().stConfirmed : st === 'cancelled' ? T().stCancelled : st === 'past' ? T().stPast : T().stNew;
  const statusBadge = b => { const st = statusOf(b); return `<span class="st ${st}">${esc(statusText(st))}</span>`; };

  let toastTimer = null;
  function showToast(msg){
    const t = $('toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  // ================= render =================
  const deck = $('deck'), dotsEl = $('dots');

  function photosOf(car){
    if (Array.isArray(car.photos) && car.photos.length) return car.photos;
    if (car.photo) return [car.photo];
    return [];
  }

  // скидка в %: есть, если обычная цена (baseprice) выше текущей
  function discountPct(car){
    const b = Number(car && car.baseprice || 0), p = Number(car && car.priceperday || 0);
    return (b > p && p > 0) ? Math.round((1 - p / b) * 100) : 0;
  }

  function specsHTML(car){
    const S = T().specs;
    const rows = [
      [S.year, car.year],
      [S.seats, car.seats],
      [S.power, car.power ? car.power + ' ' + T().hp : null],
      [S.accel, car.accel ? car.accel + ' ' + T().sec : null],
      [S.doors, car.doors],
      [S.trans, car.trans ? trVal(car.trans) : null],
      [S.fuel, car.fuel ? trVal(car.fuel) : null],
      [S.consumo, car.consumo],
    ].filter(([,v]) => v !== undefined && v !== null && v !== '');
    return rows.map(([k,v])=>`<div class="spec"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
  }

  function photoAreaHTML(car){
    const ph = photosOf(car);
    const i = photoIdx[car.id] || 0;
    const bg = ph.length ? `<img class="bgimg" src="${esc(ph[i])}" alt="">` : '';
    const fgs = ph.map((src,j)=>`<img class="fgimg ${j===i?'on':''}" src="${esc(src)}" ${Math.abs(j-i)<=1?'':'loading="lazy"'} alt="">`).join('');
    const segs = ph.length > 1
      ? `<div class="segs">${ph.map((_,j)=>`<div class="seg ${j<i?'done':''} ${j===i?'now':''}"><i></i></div>`).join('')}</div>` : '';
    const camHint = ph.length > 1
      ? `<div class="cam-hint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="3" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="13.5" r="3.4" stroke="#fff" stroke-width="1.8"/><path d="M8.5 7l1.2-2.4h4.6L15.5 7" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg> ${i+1}/${ph.length}</div>` : '';
    return `
      ${bg}${fgs}
      <div class="scrim"></div><div class="scrim-top"></div>
      ${segs}
      ${ph.length>1 ? '<div class="tz l" data-go="-1"></div><div class="tz r" data-go="1"></div>' : ''}
      <div class="chip-class">${esc(trCls(car.cls))}</div>
      ${discountPct(car) ? `<div class="chip-disc">−${discountPct(car)}%</div>` : ''}
      ${busyNowHTML(car)}
      <div class="title-block">
        <div class="nm">${esc(car.name)}</div>
        <div class="sub">${esc(car.year||'')}${car.year?' · ':''}Barcelona</div>
      </div>
      ${camHint}`;
  }

  // машина занята прямо сейчас → чип «Занята до …»
  function busyNowHTML(car){
    const t = todayStr();
    const r = (busy[car.id]||[]).find(x => x.from <= t && t <= x.to);
    return r ? `<div class="chip-busy">${esc(T().busyNow)} ${esc(fmtD(r.to))}</div>` : '';
  }
  function busyLineHTML(car){
    const r = upcomingBusy(car.id).slice(0,3);
    if (!r.length) return '';
    return `<div class="busy-line"><span>📅</span><span><b>${esc(T().busyLabel)}:</b> ${r.map(x=>esc(fmtRange(x.from,x.to))).join(' · ')}</span></div>`;
  }

  function cardHTML(car){
    return `
      <div class="ph" data-car="${esc(car.id)}">${photoAreaHTML(car)}</div>
      <div class="details">
        <div class="spec-row">${specsHTML(car)}</div>
        <div class="feats">${(car.features||[]).map(f=>`<div class="feat">${esc(trFeat(f))}</div>`).join('')}</div>
        ${busyLineHTML(car)}
      </div>`;
  }

  function renderDeck(){
    deck.innerHTML = '';
    cars.forEach((car,i)=>{
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.index = i;
      el.innerHTML = cardHTML(car);
      positionCard(el, i-current, false);
      deck.appendChild(el);
      attachDrag(el);
      attachPhotoNav(el, car);
    });
    renderDots();
    updateCta();
    updateArrows();
  }

  function renderDots(){
    dotsEl.innerHTML = cars.map((_,i)=>`<div class="dot ${i===current?'active':''}"></div>`).join('');
  }

  function mainBtnText(){
    const car = cars[current];
    if (!car) return T().book;
    const d = discountPct(car);
    return T().book + ' · €' + car.priceperday + '/' + T().day + (d ? ' (−' + d + '%)' : '');
  }

  function updateCta(){
    const car = cars[current];
    if (!car) return;
    const d = discountPct(car);
    $('ctaPrice').innerHTML = '<span>€</span>' + esc(car.priceperday) + (d ? '<s>€' + esc(car.baseprice) + '</s>' : '');
    setTxt('ctaUnit', T().perDay + (d ? ' · −' + d + '%' : ''));
    setTxt('mainBookBtn', T().book);
    if (inTG && tg.MainButton){
      try{
        tg.MainButton.setParams({
          text: mainBtnText(),
          color: '#E8A33D',
          text_color: '#161005',
          is_active: true,
          is_visible: !sheetOpen,
        });
      }catch(e){}
    }
  }

  function updateArrows(){
    $('prevBtn').classList.toggle('off', current <= 0);
    $('nextBtn').classList.toggle('off', current >= cars.length-1);
  }

  function positionCard(el, off, animate){
    el.style.transition = animate ? '' : 'none';
    if (off === 0){
      el.style.transform = 'translateX(0) rotate(0)';
      el.style.opacity = '1'; el.style.zIndex = 5; el.style.pointerEvents = 'auto';
    } else if (off === 1 || off === -1){
      el.style.transform = `translateX(${off*20}px) scale(0.95) rotate(${off*2.5}deg)`;
      el.style.opacity = '0'; el.style.zIndex = 1; el.style.pointerEvents = 'none';
    } else {
      el.style.transform = `translateX(${off>0?420:-420}px)`;
      el.style.opacity = '0'; el.style.zIndex = 0; el.style.pointerEvents = 'none';
    }
    if (!animate){ void el.offsetWidth; el.style.transition = ''; }
  }

  function updatePositions(){
    Array.from(deck.children).forEach(el=>{
      positionCard(el, parseInt(el.dataset.index,10)-current, true);
    });
    renderDots();
    updateCta();
    updateArrows();
  }

  function goTo(i){
    if (i < 0) i = 0;
    if (i > cars.length-1) i = cars.length-1;
    if (i === current) return;
    current = i;
    haptic('light');
    dismissHint();
    updatePositions();
  }

  $('prevBtn').addEventListener('click', ()=>goTo(current-1));
  $('nextBtn').addEventListener('click', ()=>goTo(current+1));

  // ---- photo navigation: tap anywhere (left half = prev, right half = next) ----
  function attachPhotoNav(cardEl, car){
    const phEl = cardEl.querySelector('.ph');
    if (!phEl) return;
    phEl.addEventListener('click', (e)=>{
      const tz = e.target.closest('.tz');
      if (!tz) return;
      const ph = photosOf(car);
      if (ph.length < 2) return;
      const dir = parseInt(tz.dataset.go,10);
      let i = (photoIdx[car.id]||0) + dir;
      if (i < 0) i = ph.length - 1;
      if (i >= ph.length) i = 0;
      photoIdx[car.id] = i;
      haptic('light');
      phEl.innerHTML = photoAreaHTML(car);
    });
  }

  // ---- drag / swipe between cars ----
  function attachDrag(el){
    let sx=0, sy=0, dx=0, drag=false, dec=false, hz=false;
    const down = e => {
      if (parseInt(el.dataset.index,10) !== current) return;
      drag = true; dec = false; hz = false;
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY; dx = 0;
      el.classList.add('dragging');
    };
    const move = e => {
      if (!drag) return;
      const p = e.touches ? e.touches[0] : e;
      dx = p.clientX - sx;
      const dy = p.clientY - sy;
      if (!dec && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){ hz = Math.abs(dx) > Math.abs(dy); dec = true; }
      if (hz){
        if (e.cancelable) e.preventDefault();
        el.style.transform = `translateX(${dx}px) rotate(${dx/24}deg)`;
      }
    };
    const up = () => {
      if (!drag) return;
      drag = false;
      el.classList.remove('dragging');
      if (hz && Math.abs(dx) > 70){
        if (dx < 0 && current < cars.length-1) goTo(current+1);
        else if (dx > 0 && current > 0) goTo(current-1);
        else updatePositions();
      } else updatePositions();
    };
    el.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, {passive:true});
    el.addEventListener('touchmove', move, {passive:false});
    el.addEventListener('touchend', up);
  }

  // ---- календарь выбора дат ----
  function renderCal(){
    const el = $('cal');
    if (!el || !activeBookingCar) return;
    const carId = activeBookingCar.id;
    const today = todayStr();
    const first = new Date(cal.y, cal.m, 1);
    const monthName = first.toLocaleDateString(locale(), {month:'long', year:'numeric'});
    const dim = new Date(cal.y, cal.m+1, 0).getDate();
    const lead = (first.getDay() + 6) % 7; // неделя с понедельника
    const now = parseD(today);
    const canPrev = cal.y > now.getFullYear() || (cal.y === now.getFullYear() && cal.m > now.getMonth());
    const canNext = new Date(cal.y, cal.m+1, 1) < new Date(now.getFullYear(), now.getMonth()+12, 1);
    let cells = '';
    for (let i=0;i<lead;i++) cells += '<div class="cal-d empty"></div>';
    for (let d=1; d<=dim; d++){
      const sd = cal.y+'-'+pad2(cal.m+1)+'-'+pad2(d);
      const cls = ['cal-d'];
      if (sd < today) cls.push('past');
      else if (isBusy(carId, sd)) cls.push('busy');
      if (sd === today) cls.push('today');
      const hasRange = cal.from && cal.to && cal.to !== cal.from;
      if (hasRange && sd > cal.from && sd < cal.to) cls.push('in');
      if (sd === cal.from){ cls.push('from'); if (hasRange) cls.push('in'); }
      if (sd === cal.to){ cls.push('to'); if (hasRange) cls.push('in'); }
      cells += `<div class="${cls.join(' ')}" data-d="${sd}">${d}</div>`;
    }
    el.innerHTML = `
      <div class="cal-head">
        <button class="cal-nav" data-nav="-1" ${canPrev?'':'disabled'}>‹</button>
        <div class="m">${esc(monthName)}</div>
        <button class="cal-nav" data-nav="1" ${canNext?'':'disabled'}>›</button>
      </div>
      <div class="cal-wd">${T().weekdays.map(w=>`<span>${esc(w)}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-legend"><span><i style="background:var(--amber)"></i>${esc(T().legendSel)}</span><span><i style="background:var(--red)"></i>${esc(T().legendBusy)}</span></div>`;
    $('selFrom').classList.toggle('on', !!cal.from);
    $('selTo').classList.toggle('on', !!cal.to);
    setTxt('selFromV', cal.from ? fmtD(cal.from) : '—');
    setTxt('selToV', cal.to ? fmtD(cal.to) : '—');
  }

  $('cal').addEventListener('click', e=>{
    const nav = e.target.closest('.cal-nav');
    if (nav){
      if (nav.disabled) return;
      cal.m += parseInt(nav.dataset.nav,10);
      if (cal.m < 0){ cal.m = 11; cal.y--; }
      if (cal.m > 11){ cal.m = 0; cal.y++; }
      haptic('light'); renderCal(); return;
    }
    const d = e.target.closest('.cal-d');
    if (!d || !d.dataset.d) return;
    if (d.classList.contains('past')){ notifyH('warning'); showToast(T().pastDay); return; }
    if (d.classList.contains('busy')){ notifyH('warning'); showToast(T().busyDay); return; }
    pickDate(d.dataset.d);
  });

  function pickDate(sd){
    const carId = activeBookingCar.id;
    if (!cal.from || cal.to || sd <= cal.from){
      cal.from = sd; cal.to = null;
    } else if (!rangeFree(carId, cal.from, sd)){
      notifyH('warning'); showToast(T().rangeBusy);
      cal.from = sd; cal.to = null;
    } else if (daysBetween(cal.from, sd) > 60){
      notifyH('warning'); showToast(T().tooLong); return;
    } else {
      cal.to = sd;
    }
    $('dateErr').classList.remove('show');
    haptic('light');
    renderCal();
    updateTotal();
  }

  // быстрый выбор: ближайшее свободное окно на N дней, начиная с выбранной даты (или сегодня)
  function quickPick(n){
    const carId = activeBookingCar.id;
    let start = (cal.from && !cal.to) ? cal.from : (cal.from || todayStr());
    if (start < todayStr()) start = todayStr();
    for (let i=0; i<366; i++){
      const a = addDays(start, i), b = addDays(a, n);
      if (rangeFree(carId, a, b)){
        cal.from = a; cal.to = b;
        const d = parseD(a); cal.y = d.getFullYear(); cal.m = d.getMonth();
        if (i > 0) showToast(fmtRange(a,b));
        return true;
      }
    }
    showToast(T().rangeBusy);
    return false;
  }

  function updateTotal(){
    const from = cal.from, to = cal.to;
    const tv = $('totalValue');
    setTxt('totalLabel', T().total);
    document.querySelectorAll('.qd').forEach(b=>{
      const d = parseInt(b.dataset.d,10);
      b.textContent = T().days(d);
      b.classList.toggle('active', !!from && !!to && daysBetween(from,to) === d);
    });
    if (!from || !to || !activeBookingCar){ tv.textContent = '—'; return; }
    const n = daysBetween(from, to);
    if (n <= 0){ tv.textContent = '—'; return; }
    tv.innerHTML = esc(T().days(n)) + ' × €' + esc(activeBookingCar.priceperday) + ' = <span>€' + esc(n * activeBookingCar.priceperday) + '</span>';
  }

  $('confirmBtn').addEventListener('click', async ()=>{
    const from = cal.from, to = cal.to;
    const name = $('nameInput').value.trim(), phone = $('phoneInput').value.trim(), note = $('noteInput').value.trim();
    const dateErr = $('dateErr'), formErr = $('formErr');
    dateErr.classList.remove('show'); formErr.classList.remove('show');
    setTxt('formErr', T().formErr);

    if (!from || !to || daysBetween(from, to) <= 0){ setTxt('dateErr', T().pickDates); dateErr.classList.add('show'); notifyH('warning'); return; }
    if (!rangeFree(activeBookingCar.id, from, to)){ setTxt('dateErr', T().conflictErr); dateErr.classList.add('show'); notifyH('warning'); renderCal(); return; }
    if (!name || !phone){ formErr.classList.add('show'); notifyH('warning'); return; }

    const btn = $('confirmBtn');
    btn.disabled = true; btn.textContent = T().sending;

    let tgUser = null, tgUserId = null;
    try{
      const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u){ tgUser = u.username || null; tgUserId = u.id || null; }
    }catch(e){}

    const n = daysBetween(from, to);
    const car = activeBookingCar;
    const booking = {
      carId: car.id, carName: car.name, priceperday: car.priceperday,
      days: n, total: n * car.priceperday,
      from, to, name, phone, note,
      tgUser, tgUserId, lang,
      initData: (tg && tg.initData) || '',
    };

    try{
      let saved;
      if (window.NOTIFY_WEBHOOK){
        const r = await apiPost({type:'booking', booking});
        if (!r || !r.ok){
          if (r && r.error === 'conflict'){
            if (r.busy) busy[car.id] = r.busy;
            setTxt('dateErr', T().conflictErr); dateErr.classList.add('show');
            notifyH('warning'); renderCal(); renderDeck();
            return;
          }
          throw new Error((r && r.error) || 'send');
        }
        saved = r.booking;
        if (r.busy) busy[car.id] = r.busy;
      } else {
        // демо-режим без сервера: только локально
        saved = Object.assign({bookingId:'local_'+Date.now(), status:'new', createdAt:new Date().toISOString()}, booking);
        delete saved.initData;
        busy[car.id] = (busy[car.id]||[]).concat([{from, to}]);
      }
      addMy(saved);
      notifyH('success');
      closeSheets();
      stampOverlay.classList.add('show');
      setTimeout(()=>stampOverlay.classList.remove('show'), 1900);
      $('noteInput').value = '';
      cal.from = null; cal.to = null;
      updateMyBadge();
      renderDeck();
    }catch(e){
      notifyH('error');
      setTxt('formErr', T().sendErr);
      formErr.classList.add('show');
    }finally{
      btn.disabled = false; btn.textContent = T().confirm;
    }
  });

          ${b.note ? '<br>💬 «'+esc(b.note)+'»' : ''}
          ${st === 'cancelled' ? '<br><span style="color:var(--text-faint)">отменена ' + (b.cancelledBy === 'client' ? 'клиентом' : 'админом') + '</span>' : ''}
          <br><span style="color:var(--text-faint);font-size:11px">${b.createdAt ? 'создана ' + new Date(b.createdAt).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}) : ''} · #${esc(String(b.bookingId||'').replace(/^bk_/,'').slice(-8).toUpperCase())}</span>
        </div>
        ${(canConfirm||canCancel) ? `<div class="req-actions">
          ${canConfirm ? '<button class="rbtn good" data-act="confirm">✅ Подтвердить</button>' : ''}
          ${canCancel ? '<button class="rbtn danger" data-act="cancel">❌ Отменить</button>' : ''}
        </div>` : ''}
      </div>`;
    }).join('') + '<div class="arefresh" data-act="refresh">Обновить список</div>';
  }

  $('adminBookings').addEventListener('click', async e=>{
    const f = e.target.closest('[data-f]');
    if (f){ adminFilter = f.dataset.f; haptic('light'); renderAdminBookings(); return; }
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'refresh'){ haptic('light'); renderAdminBookings(true); return; }
    const item = btn.closest('.req-item');
    const b = (adminBookingsCache||[]).find(x => x.bookingId === item.dataset.id);
    if (!b) return;
    const label = b.carName + ' · ' + fmtRange(b.from, b.to) + ' · ' + b.name;
    const msg = act === 'confirm' ? 'Подтвердить бронь?\n' + label : 'Отменить бронь?\n' + label;
    haptic('medium');
    askConfirm(msg, async ()=>{
      item.querySelectorAll('.rbtn').forEach(x=>x.disabled=true);
      btn.textContent = '…';
      const r = await adminApi(act, {bookingId:b.bookingId});
      if (r && r.ok){
        if (r.booking) Object.assign(b, r.booking);
        else b.status = act === 'confirm' ? 'confirmed' : 'cancelled';
        notifyH('success');
        showToast(act === 'confirm' ? 'Бронь подтверждена' : 'Бронь отменена');
        await loadAvailability();
        renderAdminBookings();
        renderDeck();
      } else {
        notifyH('error');
        showToast('Ошибка: ' + ((r && r.error) || 'нет связи'));
        renderAdminBookings();
      }
    });
  });

  // ================= info sheet =================
  $('infoBtn').addEventListener('click', ()=>{
    haptic('light');
    renderInfo();
    openSheet(infoSheet);
  });
  $('tabRules').addEventListener('click', ()=>{
    $('tabRules').classList.add('active'); $('tabServices').classList.remove('active');
    $('infoRules').style.display = ''; $('infoServices').style.display = 'none';
  });
  $('tabServices').addEventListener('click', ()=>{
    $('tabServices').classList.add('active'); $('tabRules').classList.remove('active');
    $('infoServices').style.display = ''; $('infoRules').style.display = 'none';
  });
  function renderInfo(){
    const L = T();
    const link = window.SUPPORT_LINK || 'https://t.me/StuffDive';
    $('infoRules').innerHTML =
      `<div class="info-h">${esc(L.howTitle)}</div>` +
      L.steps.map((t,i)=>`<div class="step"><div class="n">${i+1}</div><div class="t">${t}</div></div>`).join('') +
      `<div class="info-h">${esc(L.rulesTitle)}</div>` +
      L.rules.map(r=>`<div class="rule"><span class="ic">${r[0]}</span><span>${r[1]}</span></div>`).join('') +
      `<a class="link-btn" href="${esc(link)}" target="_blank" rel="noopener">${esc(L.contactBtn)}</a>`;
    $('infoServices').innerHTML =
      `<div class="info-h">${esc(L.svcTitle)}</div>` +
      L.services.map(x=>`<div class="svc"><div class="ic">${x[0]}</div><div><div class="sn">${esc(x[1])}</div><div class="sd">${esc(x[2])}</div></div></div>`).join('') +
      `<div class="info-p" style="margin-top:10px">${esc(L.svcNote)}</div>` +
      `<a class="link-btn" href="${esc(link)}" target="_blank" rel="noopener">${esc(L.contactBtn)}</a>`;
  }

  // ================= onboarding hint =================
  const HINT_KEY = 'pas:hint-v2';
  function maybeShowHint(){
    try{ if (localStorage.getItem(HINT_KEY)) return; }catch(e){}
    $('hintOverlay').classList.add('show');
  }
  function dismissHint(){
    const h = $('hintOverlay');
    if (!h.classList.contains('show')) return;
    h.classList.remove('show');
    try{ localStorage.setItem(HINT_KEY,'1'); }catch(e){}
  }
  $('hintOk').addEventListener('click', dismissHint);
  $('hintOverlay').addEventListener('click', e=>{ if (e.target === e.currentTarget) dismissHint(); });

  // ================= language =================
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
    setTxt('loadingText', T().loading);
    setTxt('bookTitle', T().bookSheetTitle);
    setTxt('lblFrom', T().from);
    setTxt('lblTo', T().to);
    setTxt('lblName', T().name);
    setTxt('lblPhone', T().phone);
    setTxt('lblNote', T().note);
    const noteEl = $('noteInput'); if (noteEl) noteEl.placeholder = T().notePh;
    setTxt('confirmBtn', T().confirm);
    setTxt('reqTitle', T().reqTitle);
    setTxt('reqSub', T().reqSub);
    setTxt('clearReq', T().clear);
    setTxt('stampT1', T().ok1);
    setTxt('stampT2', T().ok2);
    setTxt('dateErr', T().dateErr);
    setTxt('formErr', T().formErr);
    setTxt('hintSwipe', T().hintSwipe);
    setTxt('hintTap', T().hintTap);
    setTxt('hintBook', T().hintBook);
    setTxt('infoTitle', T().infoTitle);
    setTxt('tabRules', T().tabRules);
    setTxt('tabServices', T().tabServices);
    if (infoSheet.classList.contains('show')) renderInfo();
    if (activeBookingCar){
      setBookPrice();
      updateTotal();
      if (bookingSheet.classList.contains('show')) renderCal();
    } else {
      setTxt('totalLabel', T().total);
      document.querySelectorAll('.qd').forEach(b=>{ b.textContent = T().days(parseInt(b.dataset.d,10)); });
    }
    if (cars.length) renderDeck();
    if (requestsSheet.classList.contains('show')) renderRequests();
  }

  $('langSwitch').addEventListener('click', e=>{
    const b = e.target.closest('.lang-btn');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try{ localStorage.setItem(LANG_KEY, lang); }catch(e2){}
    haptic('light');
    applyLang();
  });

  // ================= keyboard (desktop) =================
  window.addEventListener('keydown', e=>{
    if (e.key === 'ArrowRight') goTo(current+1);
    if (e.key === 'ArrowLeft') goTo(current-1);
  });

  // ================= init =================
  applyTheme();
  applyLang();
  updateMyBadge();
  (async function init(){
    await Promise.all([loadFleet(), loadAvailability()]);
    renderDeck();
    maybeShowHint();
    initAdmin();
    refreshMine();
    // при возврате в приложение — обновить занятость
    document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) loadAvailability().then(()=>{ renderDeck(); if (bookingSheet.classList.contains('show')) renderCal(); }); });
  })();

})();
</script>
</body>
</html>
