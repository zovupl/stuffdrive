<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StuffDrive — Rent a Car Barcelona</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --bg:#0E0E12;
  --bg-soft:#17171C;
  --card:#1A1A20;
  --card-2:#232329;
  --line:rgba(255,255,255,0.08);
  --line-2:rgba(255,255,255,0.16);
  --text:#F4F3F0;
  --text-dim:#9C9AA3;
  --text-faint:#67656E;
  --amber:#E8A33D;
  --amber-dark:#161005;
  --green:#3DD68C;
  --red:#F05D45;
  --scrim:rgba(8,8,10,0.92);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"]{
  --bg:#F2F2F7;
  --bg-soft:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F2F2F7;
  --line:rgba(0,0,0,0.07);
  --line-2:rgba(0,0,0,0.14);
  --text:#1B1B20;
  --text-dim:#6E6E76;
  --text-faint:#9A9AA2;
  --scrim:rgba(8,8,10,0.88);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;justify-content:center;
  overscroll-behavior:none;
  transition:background .25s;
}

#app{
  width:100%;max-width:430px;
  height:100vh;height:100dvh;
  position:relative;
  display:flex;flex-direction:column;
  overflow:hidden;
}
body.tg #app{height:var(--tg-viewport-stable-height,100dvh);}

/* ============ HEADER ============ */
.header{
  padding:12px 14px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  flex-shrink:0;
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;}
.brand .eyebrow{
  font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--amber);white-space:nowrap;
}
.brand h1{
  font-size:16px;font-weight:800;letter-spacing:0.02em;
  margin:0;color:var(--text);white-space:nowrap;
}
.header-right{display:flex;align-items:center;gap:7px;flex-shrink:0;}

.lang-switch{
  display:flex;
  background:var(--bg-soft);
  border:1px solid var(--line);
  border-radius:50px;
  padding:2.5px;
}
.lang-btn{
  border:none;background:transparent;
  color:var(--text-faint);
  font-family:inherit;
  font-size:10.5px;font-weight:700;
  padding:6px 8px;border-radius:50px;
  cursor:pointer;transition:all .2s;
}
.lang-btn.active{background:var(--amber);color:var(--amber-dark);}

.icon-btn{
  width:34px;height:34px;border-radius:50%;
  background:var(--bg-soft);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);cursor:pointer;
  transition:transform .15s;
  flex-shrink:0;
}
.icon-btn:active{transform:scale(0.9);}

.my-badge{
  display:flex;align-items:center;gap:5px;
  height:34px;padding:0 11px;border-radius:50px;
  background:rgba(232,163,61,0.14);
  border:1px solid rgba(232,163,61,0.45);
  color:var(--amber);
  font-family:inherit;font-size:12.5px;font-weight:800;
  cursor:pointer;transition:transform .15s;flex-shrink:0;
}
.my-badge:active{transform:scale(0.92);}

/* admin panel */
.atabs{display:flex;gap:7px;margin-bottom:14px;}
.atab{
  flex:1;border:1px solid var(--line-2);background:var(--card);
  color:var(--text-dim);font-family:inherit;font-size:13px;font-weight:700;
  border-radius:50px;padding:9px 0;cursor:pointer;transition:all .15s;
}
.atab.active{background:var(--amber);border-color:var(--amber);color:var(--amber-dark);}
.acar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);background:var(--card);
  border-radius:14px;padding:12px 13px;margin-bottom:9px;
}
.acar.inactive{opacity:0.55;}
.acar .an{font-size:14px;font-weight:800;}
.acar .as{font-size:11.5px;font-weight:600;color:var(--text-dim);margin-top:2px;}
.acar-r{display:flex;gap:6px;flex-shrink:0;}
.abtn{
  border:1px solid var(--line-2);background:var(--card-2);
  color:var(--text);font-family:inherit;font-size:12px;font-weight:700;
  border-radius:10px;padding:8px 11px;cursor:pointer;transition:transform .12s;
}
.abtn:active{transform:scale(0.93);}
.abtn.danger{color:var(--red);border-color:rgba(240,93,69,0.4);}
.abtn.good{color:var(--green);border-color:rgba(61,214,140,0.4);}
.aprice-row{display:flex;gap:7px;margin:-3px 0 9px;}
.aprice-row input{
  flex:1;border:1.5px solid var(--line-2);border-radius:10px;
  padding:9px 12px;font-family:inherit;font-size:14px;
  color:var(--text);background:var(--card);outline:none;
}
.aprice-row input:focus{border-color:var(--amber);}
.astatus{font-size:11px;font-weight:700;padding:3px 8px;border-radius:50px;}
.astatus.new{color:var(--amber);background:rgba(232,163,61,0.13);}
.aloading{text-align:center;padding:26px;color:var(--text-faint);font-size:13px;}

/* ============ DECK ============ */
.deck-wrap{flex:1;position:relative;padding:2px 14px 0;min-height:0;}
.deck{position:relative;width:100%;height:100%;}
.deck-loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:center;
  color:var(--text-faint);font-size:12px;font-weight:600;letter-spacing:0.06em;
}
.spinner{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid var(--line-2);
  border-top-color:var(--amber);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.card{
  position:absolute;inset:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  display:flex;flex-direction:column;
  touch-action:pan-y;
  will-change:transform;
  transition:transform .38s cubic-bezier(.22,.9,.24,1), opacity .38s;
  box-shadow:0 18px 48px rgba(0,0,0,0.4);
}
:root[data-theme="light"] .card{box-shadow:0 14px 40px rgba(0,0,0,0.14);}
.card.dragging{transition:none;}

/* ---- photo area ---- */
.ph{
  position:relative;height:52%;flex-shrink:0;
  background:#101014;overflow:hidden;user-select:none;
  cursor:pointer;
}
.ph .bgimg{
  position:absolute;inset:-24px;
  width:calc(100% + 48px);height:calc(100% + 48px);
  object-fit:cover;
  filter:blur(22px) brightness(0.72) saturate(1.15);
}
.ph .fgimg{
  position:absolute;inset:0;z-index:1;
  width:100%;height:100%;object-fit:contain;object-position:center;
  opacity:0;transition:opacity .28s;
}
.ph .fgimg.on{opacity:1;}
.ph .scrim{
  position:absolute;left:0;right:0;bottom:0;height:42%;z-index:2;
  background:linear-gradient(to top, var(--scrim), transparent);
  pointer-events:none;
}
.ph .scrim-top{
  position:absolute;left:0;right:0;top:0;height:52px;z-index:2;
  background:linear-gradient(to bottom, rgba(8,8,10,0.5), transparent);
  pointer-events:none;
}
.ph .segs{position:absolute;top:9px;left:12px;right:12px;display:flex;gap:4px;z-index:4;}
.ph .seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,0.3);overflow:hidden;}
.ph .seg i{display:block;height:100%;width:0%;background:#fff;border-radius:3px;}
.ph .seg.done i{width:100%;}
.ph .seg.now i{width:100%;background:var(--amber);}
.ph .tz{position:absolute;top:0;bottom:0;width:50%;z-index:3;}
.ph .tz.l{left:0;}
.ph .tz.r{right:0;}

.chip-class{
  position:absolute;top:20px;right:12px;z-index:4;
  font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--amber);
  background:rgba(10,10,12,0.6);
  border:1px solid rgba(232,163,61,0.4);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:5px 10px;border-radius:50px;
}
.chip-disc{
  position:absolute;top:20px;left:12px;z-index:4;
  font-size:10.5px;font-weight:800;letter-spacing:0.04em;
  color:#fff;
  background:rgba(240,93,69,0.92);
  padding:5px 9px;border-radius:50px;
}
.ph .title-block{position:absolute;left:14px;right:14px;bottom:10px;z-index:4;pointer-events:none;}
.ph .title-block .nm{
  font-size:22px;font-weight:800;letter-spacing:-0.01em;
  color:#fff;line-height:1.15;
  text-shadow:0 2px 12px rgba(0,0,0,0.55);
}
.ph .title-block .sub{
  margin-top:2px;font-size:11.5px;font-weight:600;
  color:rgba(255,255,255,0.8);
}
.ph .cam-hint{
  position:absolute;bottom:12px;right:12px;z-index:4;
  display:flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:700;
  color:rgba(255,255,255,0.85);
  background:rgba(10,10,12,0.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:4px 9px;border-radius:50px;
  pointer-events:none;
}

/* car nav arrows */
.nav-arrow{
  position:absolute;top:26%;z-index:6;
  width:32px;height:32px;border-radius:50%;
  background:rgba(14,14,18,0.55);
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;
  transition:opacity .2s, transform .15s;
}
.nav-arrow:active{transform:scale(0.88);}
.nav-arrow.l{left:6px;}
.nav-arrow.r{right:6px;}
.nav-arrow.off{opacity:0;pointer-events:none;}

/* ---- details ---- */
.details{
  flex:1;min-height:0;overflow-y:auto;
  padding:14px 14px 12px;
  -webkit-overflow-scrolling:touch;
}
.spec-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px;}
.spec{
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px 9px 8px;
  display:flex;flex-direction:column;gap:2px;
}
.spec .k{font-size:9px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-faint);}
.spec .v{font-size:12.5px;font-weight:700;color:var(--text);}
.feats{display:flex;flex-wrap:wrap;gap:6px;}
.feat{
  font-size:11.5px;font-weight:600;color:var(--text-dim);
  background:var(--card-2);
  border:1px solid var(--line);
  padding:5px 10px;border-radius:50px;
}
.feat::before{
  content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--amber);margin-right:6px;vertical-align:1.5px;
}

/* dots */
.dots{display:flex;justify-content:center;gap:5px;padding:9px 0 4px;flex-shrink:0;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line-2);transition:all .25s;}
.dot.active{width:18px;border-radius:3px;background:var(--amber);}

/* ============ CTA (browser fallback) ============ */
.cta-bar{
  padding:9px 14px calc(12px + var(--safe-bottom));
  display:none;align-items:center;gap:12px;flex-shrink:0;
}
body:not(.tg) .cta-bar{display:flex;}
.price-box{display:flex;flex-direction:column;flex-shrink:0;}
.price-box .p{font-size:21px;font-weight:800;line-height:1.05;}
.price-box .p span{color:var(--amber);}
.price-box .p s{font-size:13px;font-weight:700;color:var(--text-faint);margin-left:4px;}
.price-box .u{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);}
.book-btn{
  flex:1;border:none;border-radius:14px;
  background:linear-gradient(135deg,#F0B254,#DD8F2A);
  color:var(--amber-dark);
  font-family:inherit;font-weight:800;font-size:15px;
  padding:15px 10px;cursor:pointer;
  box-shadow:0 8px 24px rgba(232,163,61,0.26);
  transition:transform .15s;
}
.book-btn:active{transform:scale(0.97);}
body.tg .dots{padding-bottom:calc(10px + var(--safe-bottom));}

/* ============ SHEETS ============ */
.overlay{
  position:absolute;inset:0;z-index:20;
  background:rgba(5,5,7,0.6);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:21;
  background:var(--bg-soft);
  border-top:1px solid var(--line-2);
  border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + var(--safe-bottom));
  transform:translateY(103%);
  transition:transform .34s cubic-bezier(.22,.9,.24,1);
  max-height:92%;overflow-y:auto;color:var(--text);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;border-radius:4px;background:var(--line-2);margin:8px auto 14px;}
.sheet h3{font-size:18px;font-weight:800;margin:0 0 12px;}

.book-car-row{
  display:flex;align-items:center;gap:11px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;padding:9px;margin-bottom:14px;
}
.book-car-row img{width:64px;height:48px;object-fit:cover;border-radius:9px;background:#101014;}
.book-car-row .bi{min-width:0;}
.book-car-row .bn{font-size:14.5px;font-weight:800;}
.book-car-row .bp{font-size:12px;font-weight:600;color:var(--text-dim);margin-top:1px;}
.book-car-row .bp s{color:var(--text-faint);}
.book-car-row .bp b{color:var(--red);}

.field{margin-bottom:12px;}
.field label{
  display:block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:5px;
}
.field input,.field textarea{
  width:100%;
  border:1.5px solid var(--line-2);
  border-radius:12px;
  padding:12px 13px;
  font-family:inherit;font-size:15px;
  color:var(--text);background:var(--card);
  outline:none;transition:border-color .2s;
}
:root[data-theme="dark"] .field input,
:root[data-theme="dark"] .field textarea{color-scheme:dark;}
.field input:focus,.field textarea:focus{border-color:var(--amber);}
.date-row{display:flex;gap:9px;}
.date-row .field{flex:1;}

.quick-days{display:flex;gap:6px;margin:-4px 0 12px;}
.qd{
  flex:1;border:1px solid var(--line-2);background:var(--card);
  color:var(--text-dim);
  font-family:inherit;font-size:12px;font-weight:700;
  border-radius:50px;padding:7px 0;cursor:pointer;transition:all .15s;
}
.qd.active{background:var(--amber);border-color:var(--amber);color:var(--amber-dark);}

.total-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);
  border:1px dashed var(--line-2);
  border-radius:12px;
  padding:11px 14px;margin-bottom:13px;
}
.total-row .tl{font-size:12.5px;font-weight:600;color:var(--text-dim);}
.total-row .tv{font-size:17px;font-weight:800;}
.total-row .tv span{color:var(--amber);}

.err{color:var(--red);font-size:12px;font-weight:600;margin:-4px 0 10px;display:none;}
.err.show{display:block;}

.confirm-btn{
  width:100%;border:none;border-radius:14px;
  background:linear-gradient(135deg,#F0B254,#DD8F2A);
  color:var(--amber-dark);
  font-family:inherit;font-weight:800;font-size:15px;
  padding:15px;cursor:pointer;margin-top:2px;
  transition:transform .15s, opacity .2s;
}
.confirm-btn:active{transform:scale(0.98);}
.confirm-btn:disabled{opacity:0.55;}

.req-item{
  border:1px solid var(--line);background:var(--card);
  border-radius:14px;padding:12px 13px;margin-bottom:9px;
}
.req-item .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.req-item .car{font-weight:800;font-size:14px;}
.req-item .when{font-size:11px;font-weight:600;color:var(--text-faint);}
.req-item .meta{font-size:12.5px;color:var(--text-dim);line-height:1.55;}
.req-empty{text-align:center;padding:32px 10px;color:var(--text-faint);font-size:13px;line-height:1.5;}
.sheet .sub{font-size:12.5px;color:var(--text-dim);margin:-6px 0 14px;}
.clear-link{display:block;text-align:center;font-size:12px;color:var(--text-faint);margin-top:12px;text-decoration:underline;cursor:pointer;}

/* success overlay */
#stampOverlay{
  position:absolute;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  background:rgba(5,5,7,0.78);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#stampOverlay.show{opacity:1;}
.stamp{text-align:center;transform:scale(0.7);transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
#stampOverlay.show .stamp{transform:scale(1);}
.stamp .ring{
  width:76px;height:76px;border-radius:50%;
  border:2.5px solid var(--green);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 15px;
  box-shadow:0 0 40px rgba(61,214,140,0.25);
}
.stamp .t1{font-size:20px;font-weight:800;color:#fff;}
.stamp .t2{font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);margin-top:5px;}

/* onboarding hint */
#hintOverlay{
  position:absolute;inset:0;z-index:15;
  display:none;align-items:center;justify-content:center;
  background:rgba(5,5,7,0.72);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border-radius:20px;
}
#hintOverlay.show{display:flex;}
.hint-box{text-align:center;padding:20px;color:#fff;}
.hint-line{display:flex;align-items:center;gap:12px;margin-bottom:18px;text-align:left;}
.hint-ic{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.22);
  display:flex;align-items:center;justify-content:center;
  font-size:19px;
}
.hint-tx{font-size:13.5px;font-weight:600;line-height:1.4;color:rgba(255,255,255,0.92);}
.hint-ok{
  border:none;border-radius:50px;
  background:var(--amber);color:var(--amber-dark);
  font-family:inherit;font-weight:800;font-size:14px;
  padding:11px 34px;cursor:pointer;margin-top:4px;
}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<div id="app">

  <div class="header">
    <div class="brand">
      <span class="eyebrow">StuffDrive</span>
      <h1>BARCELONA</h1>
    </div>
    <div class="header-right">
      <div class="lang-switch" id="langSwitch">
        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ru">RU</button>
      </div>
      <div class="icon-btn" id="themeBtn">
        <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 12.4A8 8 0 1 1 11.6 4a6.5 6.5 0 0 0 8.4 8.4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="icon-btn" id="adminBtn" style="display:none">

(function(){

  // ================= i18n =================

    },

      loading:'Loading cars…', swipe:'Swipe the card to switch cars',

      hintBook:'Press “Book” below, pick your dates and send the request',

      specs:{year:'Year',seats:'Seats',doors:'Doors',trans:'Gearbox',fuel:'Fuel',consumo:'Consumption',power:'Power',accel:'0–100 km/h'},

      feats:{ac:'A/C',bluetooth:'Bluetooth',carplay:'CarPlay',leather:'Leather',panorama:'Panoramic roof',camera:'Rear camera',sensors:'Parking sensors',cruise:'Cruise control',heated:'Heated seats',keyless:'Keyless',led:'LED lights',awd:'AWD','7seats':'7 seats',navi:'Navigation',usb:'USB',convertible:'Convertible',sport:'Sport mode',massage:'Massage seats',v8:'V8 engine'}

      bookSheetTitle:'Бронирование', from:'Получение', to:'Возврат',
      total:'Итого', name:'Имя', phone:'Телефон / Telegram', note:'Комментарий (необязательно)',
      notePh:'Время получения, аэропорт…', confirm:'Отправить заявку', sending:'Отправляем…',
      dateErr:'Дата возврата должна быть позже даты получения.',
      formErr:'Укажите имя и телефон, чтобы продолжить.',
      sendErr:'Не удалось отправить. Попробуйте ещё раз.',
      ok1:'Заявка отправлена!', ok2:'Мы скоро свяжемся с вами',
      reqTitle:'Мои заявки', reqSub:'Заявки, отправленные с этого устройства.',
      reqEmpty:'Заявок пока нет.<br>Выберите машину и забронируйте.',
      clear:'Очистить локальную историю', clearAsk:'Очистить локальную историю?',
      photos:'фото',
      hintSwipe:'Свайпай карточку влево-вправо, чтобы листать машины',

      hintBook:'Нажми «Забронировать» внизу, выбери даты и отправь заявку',
      hp:'л.с.', sec:'с',
      specs:{year:'Год',seats:'Мест',doors:'Дверей',trans:'Коробка',fuel:'Топливо',consumo:'Расход',power:'Мощность',accel:'0–100 км/ч'},
      vals:{auto:'Автомат',manual:'Механика',petrol:'Бензин',diesel:'Дизель',hybrid:'Гибрид',electric:'Электро'},
      cls:{estate:'Универсал',muscle:'Спорткар',suv:'Внедорожник',compact:'Компакт',premium:'Премиум',economy:'Эконом',electric:'Электро',convertible:'Кабриолет'},
      feats:{ac:'Кондиционер',bluetooth:'Bluetooth',carplay:'CarPlay',leather:'Кожа',panorama:'Панорамная крыша',camera:'Камера заднего вида',sensors:'Парктроники',cruise:'Круиз-контроль',heated:'Подогрев сидений',keyless:'Keyless',led:'LED-фары',awd:'Полный привод','7seats':'7 мест',navi:'Навигация',usb:'USB',convertible:'Кабриолет',sport:'Спорт-режим',massage:'Массаж сидений',v8:'Мотор V8'}
    }
  };

  const LANG_KEY = 'pas:lang';
  function detectLang(){
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) return saved;
    let code = '';
    try{ code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || ''; }catch(e){}
    code = String(code).slice(0,2).toLowerCase();
    if (['ru','uk','be','kk'].includes(code)) return 'ru';
    if (['es','ca'].includes(code)) return 'es';
    return 'en';
  }
  let lang = detectLang();
  const T = () => I18N[lang];
  const trVal  = v => (T().vals[v]  || v);
  const trCls  = v => (T().cls[v]   || v);
  const trFeat = v => (T().feats[v] || v);

  // ================= theme =================
  const THEME_KEY = 'pas:theme';
  function detectTheme(){
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') return saved;
    try{ if (tg && tg.colorScheme === 'light') return 'light'; }catch(e){}
    return 'dark';
  }
  let theme = detectTheme();
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', theme);
    const dk = theme === 'dark';
    document.getElementById('iconMoon').style.display = dk ? '' : 'none';
    document.getElementById('iconSun').style.display  = dk ? 'none' : '';
    try{
      tg && tg.setHeaderColor && tg.setHeaderColor(dk ? '#0E0E12' : '#F2F2F7');
      tg && tg.setBackgroundColor && tg.setBackgroundColor(dk ? '#0E0E12' : '#F2F2F7');
    }catch(e){}
  }
  document.getElementById('themeBtn').addEventListener('click', ()=>{
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, theme);
    haptic('light');
    applyTheme();
  });

  // ================= data =================
  const FB = window.FIREBASE_CONFIG || null;
  const MY_BOOKINGS_KEY = 'pas:my-bookings';

  const DEMO_CARS = [
    {id:'d1', name:'Audi A4 Avant', cls:'estate', priceperday:55, year:'2020', seats:5, doors:5, trans:'auto', fuel:'diesel', features:['ac','leather','navi'], photos:[]},
  ];

  let cars = [];
  let allCars = [];   // включая скрытые — для админ-панели
  let current = 0;
  let activeBookingCar = null;
  let isAdmin = false;
  const photoIdx = {};

  function fireBase(){
    return 'https://firestore.googleapis.com/v1/projects/' + FB.projectId + '/databases/(default)/documents';
  }
  function fromFv(v){
    if (v == null) return null;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return parseInt(v.integerValue,10);
    if ('doubleValue' in v) return v.doubleValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('arrayValue' in v) return (v.arrayValue.values||[]).map(fromFv);
    if ('mapValue' in v){ const o={}; const f=v.mapValue.fields||{}; for(const k in f) o[k]=fromFv(f[k]); return o; }
    return null;
  }
  function toFv(x){
    if (x === null || x === undefined) return {nullValue:null};
    if (typeof x === 'string') return {stringValue:x};
    if (typeof x === 'number') return Number.isInteger(x) ? {integerValue:String(x)} : {doubleValue:x};
    if (typeof x === 'boolean') return {booleanValue:x};
    if (Array.isArray(x)) return {arrayValue:{values:x.map(toFv)}};
    if (typeof x === 'object'){ const f={}; for(const k in x) f[k]=toFv(x[k]); return {mapValue:{fields:f}}; }
    return {nullValue:null};
  }
  function docToObj(doc){
    const o = {}; const f = doc.fields || {};
    for (const k in f) o[k] = fromFv(f[k]);
    o.id = doc.name.split('/').pop();
    return o;
  }

  async function loadFleet(){
    if (FB){
      try{
        const res = await fetch(fireBase() + '/cars?pageSize=300&key=' + FB.apiKey);
        const data = await res.json();
        if (data.documents && data.documents.length){
          allCars = data.documents.map(docToObj)
            .sort((a,b) => (a.order||999)-(b.order||999) || String(a.name).localeCompare(String(b.name)));
          const list = allCars.filter(c => c.active !== false);
          if (list.length){ cars = list; return; }
        }
      }catch(e){}
    }
    cars = DEMO_CARS;
    allCars = DEMO_CARS;
  }

  async function saveBooking(b){
    try{
      const mine = JSON.parse(localStorage.getItem(MY_BOOKINGS_KEY) || '[]');
      mine.unshift(b);
      localStorage.setItem(MY_BOOKINGS_KEY, JSON.stringify(mine.slice(0,50)));
    }catch(e){}
    if (FB){
      const fields = {}; for (const k in b) fields[k] = toFv(b[k]);
      const res = await fetch(fireBase() + '/bookings?key=' + FB.apiKey, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({fields})
      });
      if (!res.ok) throw new Error('firestore ' + res.status);
    }
    if (window.NOTIFY_WEBHOOK){
      try{ fetch(window.NOTIFY_WEBHOOK, {method:'POST', body: JSON.stringify({type:'booking', booking:b})}).catch(()=>{}); }catch(e){}
    }
  }

  const loadMy = () => { try{ return JSON.parse(localStorage.getItem(MY_BOOKINGS_KEY)||'[]'); }catch(e){ return []; } };
  const clearMy = () => { try{ localStorage.removeItem(MY_BOOKINGS_KEY); }catch(e){} };

  // ================= helpers =================
  const $ = id => document.getElementById(id);
  const setTxt = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayStr = () => new Date().toISOString().slice(0,10);
  const addDays = (dstr, n) => { const d = new Date(dstr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
  const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  // ================= render =================
  const deck = $('deck'), dotsEl = $('dots');

  function photosOf(car){
    if (Array.isArray(car.photos) && car.photos.length) return car.photos;
    if (car.photo) return [car.photo];
    return [];
  }

  // скидка в %: есть, если обычная цена (baseprice) выше текущей
  function discountPct(car){
    const b = Number(car && car.baseprice || 0), p = Number(car && car.priceperday || 0);
    return (b > p && p > 0) ? Math.round((1 - p / b) * 100) : 0;
  }

  function specsHTML(car){
    const S = T().specs;
    const rows = [
      [S.year, car.year],
      [S.seats, car.seats],
      [S.power, car.power ? car.power + ' ' + T().hp : null],
      [S.accel, car.accel ? car.accel + ' ' + T().sec : null],
      [S.doors, car.doors],
      [S.trans, car.trans ? trVal(car.trans) : null],
      [S.fuel, car.fuel ? trVal(car.fuel) : null],
      [S.consumo, car.consumo],
    ].filter(([,v]) => v !== undefined && v !== null && v !== '');
    return rows.map(([k,v])=>`<div class="spec"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');
  }

  function photoAreaHTML(car){
    const ph = photosOf(car);
    const i = photoIdx[car.id] || 0;
    const bg = ph.length ? `<img class="bgimg" src="${esc(ph[i])}" alt="">` : '';
    const fgs = ph.map((src,j)=>`<img class="fgimg ${j===i?'on':''}" src="${esc(src)}" ${Math.abs(j-i)<=1?'':'loading="lazy"'} alt="">`).join('');
    const segs = ph.length > 1
      ? `<div class="segs">${ph.map((_,j)=>`<div class="seg ${j<i?'done':''} ${j===i?'now':''}"><i></i></div>`).join('')}</div>` : '';
    const camHint = ph.length > 1
      ? `<div class="cam-hint"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="13" rx="3" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="13.5" r="3.4" stroke="#fff" stroke-width="1.8"/><path d="M8.5 7l1.2-2.4h4.6L15.5 7" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg> ${i+1}/${ph.length}</div>` : '';
    return `
      ${bg}${fgs}
      <div class="scrim"></div><div class="scrim-top"></div>
      ${segs}
      ${ph.length>1 ? '<div class="tz l" data-go="-1"></div><div class="tz r" data-go="1"></div>' : ''}
      <div class="chip-class">${esc(trCls(car.cls))}</div>
      ${discountPct(car) ? `<div class="chip-disc">−${discountPct(car)}%</div>` : ''}
      <div class="title-block">
        <div class="nm">${esc(car.name)}</div>
        <div class="sub">${esc(car.year||'')}${car.year?' · ':''}Barcelona</div>
      </div>
      ${camHint}`;
  }

  function cardHTML(car){
    return `
      <div class="ph" data-car="${esc(car.id)}">${photoAreaHTML(car)}</div>
      <div class="details">
        <div class="spec-row">${specsHTML(car)}</div>
        <div class="feats">${(car.features||[]).map(f=>`<div class="feat">${esc(trFeat(f))}</div>`).join('')}</div>
      </div>`;
  }

  function renderDeck(){
    deck.innerHTML = '';
    cars.forEach((car,i)=>{
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.index = i;
      el.innerHTML = cardHTML(car);
      positionCard(el, i-current, false);
      deck.appendChild(el);
      attachDrag(el);
      attachPhotoNav(el, car);
    });
    renderDots();
    updateCta();
    updateArrows();
  }

  function renderDots(){
    dotsEl.innerHTML = cars.map((_,i)=>`<div class="dot ${i===current?'active':''}"></div>`).join('');
  }

  function mainBtnText(){
    const car = cars[current];
    if (!car) return T().book;
    const d = discountPct(car);
    return T().book + ' · €' + car.priceperday + '/' + T().day + (d ? ' (−' + d + '%)' : '');
  }

  function updateCta(){
    const car = cars[current];
    if (!car) return;
    const d = discountPct(car);
    $('ctaPrice').innerHTML = '<span>€</span>' + esc(car.priceperday) + (d ? '<s>€' + esc(car.baseprice) + '</s>' : '');
    setTxt('ctaUnit', T().perDay + (d ? ' · −' + d + '%' : ''));
    setTxt('mainBookBtn', T().book);
    if (inTG && tg.MainButton){
      try{
        tg.MainButton.setParams({
          text: mainBtnText(),
          color: '#E8A33D',
          text_color: '#161005',
          is_active: true,
          is_visible: !sheetOpen,
        });
      }catch(e){}
    }
  }

  function updateArrows(){
    $('prevBtn').classList.toggle('off', current <= 0);
    $('nextBtn').classList.toggle('off', current >= cars.length-1);
  }

  function positionCard(el, off, animate){
    el.style.transition = animate ? '' : 'none';
    if (off === 0){
      el.style.transform = 'translateX(0) rotate(0)';
      el.style.opacity = '1'; el.style.zIndex = 5; el.style.pointerEvents = 'auto';
    } else if (off === 1 || off === -1){
      el.style.transform = `translateX(${off*20}px) scale(0.95) rotate(${off*2.5}deg)`;
      el.style.opacity = '0'; el.style.zIndex = 1; el.style.pointerEvents = 'none';
    } else {
      el.style.transform = `translateX(${off>0?420:-420}px)`;
      el.style.opacity = '0'; el.style.zIndex = 0; el.style.pointerEvents = 'none';
    }
    if (!animate){ void el.offsetWidth; el.style.transition = ''; }
  }

  function updatePositions(){
    Array.from(deck.children).forEach(el=>{
      positionCard(el, parseInt(el.dataset.index,10)-current, true);
    });
    renderDots();
    updateCta();
    updateArrows();
  }

  function goTo(i){
    if (i < 0) i = 0;
    if (i > cars.length-1) i = cars.length-1;
    if (i === current) return;
    current = i;
    haptic('light');
    dismissHint();
    updatePositions();
  }

  $('prevBtn').addEventListener('click', ()=>goTo(current-1));
  $('nextBtn').addEventListener('click', ()=>goTo(current+1));

  // ---- photo navigation: tap anywhere (left half = prev, right half = next) ----
  function attachPhotoNav(cardEl, car){
    const phEl = cardEl.querySelector('.ph');
    if (!phEl) return;
    phEl.addEventListener('click', (e)=>{
      const tz = e.target.closest('.tz');
      if (!tz) return;
      const ph = photosOf(car);
      if (ph.length < 2) return;
      const dir = parseInt(tz.dataset.go,10);
      let i = (photoIdx[car.id]||0) + dir;
      if (i < 0) i = ph.length - 1;
      if (i >= ph.length) i = 0;
      photoIdx[car.id] = i;
      haptic('light');
      phEl.innerHTML = photoAreaHTML(car);
    });
  }

  // ---- drag / swipe between cars ----
  function attachDrag(el){
    let sx=0, sy=0, dx=0, drag=false, dec=false, hz=false;
    const down = e => {
      if (parseInt(el.dataset.index,10) !== current) return;
      drag = true; dec = false; hz = false;
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY; dx = 0;
      el.classList.add('dragging');
    };
    const move = e => {
      if (!drag) return;
      const p = e.touches ? e.touches[0] : e;
      dx = p.clientX - sx;
      const dy = p.clientY - sy;
      if (!dec && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){ hz = Math.abs(dx) > Math.abs(dy); dec = true; }
      if (hz){
        if (e.cancelable) e.preventDefault();
        el.style.transform = `translateX(${dx}px) rotate(${dx/24}deg)`;
      }
    };
    const up = () => {
      if (!drag) return;
      drag = false;
      el.classList.remove('dragging');
      if (hz && Math.abs(dx) > 70){
        if (dx < 0 && current < cars.length-1) goTo(current+1);
        else if (dx > 0 && current > 0) goTo(current-1);
        else updatePositions();
      } else updatePositions();
    };
    el.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, {passive:true});
    el.addEventListener('touchmove', move, {passive:false});
    el.addEventListener('touchend', up);
  }

  // ================= sheets =================
  const overlay = $('overlay'), bookingSheet = $('bookingSheet'), requestsSheet = $('requestsSheet'), adminSheet = $('adminSheet'), stampOverlay = $('stampOverlay');
  let sheetOpen = false;
  function openSheet(s){
    sheetOpen = true;
    overlay.classList.add('show'); s.classList.add('show');
    if (inTG && tg.MainButton){ try{ tg.MainButton.hide(); }catch(e){} }
  }
  function closeSheets(){
    sheetOpen = false;
    overlay.classList.remove('show');
    bookingSheet.classList.remove('show');
    requestsSheet.classList.remove('show');
    adminSheet.classList.remove('show');
    updateCta();
  }
  overlay.addEventListener('click', closeSheets);

  // ---- booking ----
  function openBooking(){
    if (!cars.length) return;
    activeBookingCar = cars[current];
    const ph = photosOf(activeBookingCar);
    $('bookThumb').src = ph[0] || '';
    setTxt('bookCarName', activeBookingCar.name);
    setBookPrice();
    const from = $('dateFrom'), to = $('dateTo');
    from.min = todayStr();
    if (!from.value) from.value = todayStr();
    to.min = addDays(from.value, 1);
    if (!to.value || new Date(to.value) <= new Date(from.value)) to.value = addDays(from.value, 3);
    $('dateErr').classList.remove('show');
    $('formErr').classList.remove('show');
    let pre = '';
    try{ pre = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || ''; }catch(e){}
    if (pre && !$('nameInput').value) $('nameInput').value = pre;
    updateTotal();
    haptic('medium');
    openSheet(bookingSheet);
  }
  $('mainBookBtn').addEventListener('click', openBooking);
  if (inTG && tg.MainButton){
    try{ tg.MainButton.onClick(()=>{ if (!sheetOpen) openBooking(); }); }catch(e){}
  }

  function setBookPrice(){
    if (!activeBookingCar) return;
    const d = discountPct(activeBookingCar);
    $('bookCarPrice').innerHTML = '€' + esc(activeBookingCar.priceperday) + ' / ' + esc(T().day)
      + (d ? ' · <s>€' + esc(activeBookingCar.baseprice) + '</s> <b>−' + d + '%</b>' : '');
  }

  function updateTotal(){
    const from = $('dateFrom').value, to = $('dateTo').value;
    const tv = $('totalValue');
    setTxt('totalLabel', T().total);
    document.querySelectorAll('.qd').forEach(b=>{
      const d = parseInt(b.dataset.d,10);
      b.textContent = T().days(d);
      b.classList.toggle('active', !!from && !!to && daysBetween(from,to) === d);
    });
    if (!from || !to || !activeBookingCar){ tv.textContent = '—'; return; }
    const n = daysBetween(from, to);
    if (n <= 0){ tv.textContent = '—'; return; }
    tv.innerHTML = esc(T().days(n)) + ' × €' + esc(activeBookingCar.priceperday) + ' = <span>€' + esc(n * activeBookingCar.priceperday) + '</span>';
  }
  $('dateFrom').addEventListener('change', ()=>{ $('dateTo').min = addDays($('dateFrom').value||todayStr(),1); updateTotal(); });
  $('dateTo').addEventListener('change', updateTotal);
  $('quickDays').addEventListener('click', e=>{
    const b = e.target.closest('.qd');
    if (!b) return;
    const from = $('dateFrom').value || todayStr();
    $('dateFrom').value = from;
    $('dateTo').value = addDays(from, parseInt(b.dataset.d,10));
    haptic('light');
    updateTotal();
  });

  $('confirmBtn').addEventListener('click', async ()=>{
    const from = $('dateFrom').value, to = $('dateTo').value;
    const name = $('nameInput').value.trim(), phone = $('phoneInput').value.trim(), note = $('noteInput').value.trim();
    const dateErr = $('dateErr'), formErr = $('formErr');
    dateErr.classList.remove('show'); formErr.classList.remove('show');
    setTxt('dateErr', T().dateErr);
    setTxt('formErr', T().formErr);

    if (!from || !to || new Date(to) <= new Date(from)){ dateErr.classList.add('show'); return; }
    if (!name || !phone){ formErr.classList.add('show'); return; }

    const btn = $('confirmBtn');
    btn.disabled = true; btn.textContent = T().sending;

    let tgUser = null, tgUserId = null;
    try{
      const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u){ tgUser = u.username || null; tgUserId = u.id || null; }
    }catch(e){}

    const n = daysBetween(from, to);
    const booking = {
      bookingId: 'bk_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      carId: activeBookingCar.id,
      carName: activeBookingCar.name,
      priceperday: activeBookingCar.priceperday,
      days: n,
      total: n * activeBookingCar.priceperday,
      from, to, name, phone, note,
      createdAt: new Date().toISOString(),
      tgUser, tgUserId,
      status: 'new',
      lang,
    };

    try{
      await saveBooking(booking);
      notifyH('success');
      closeSheets();
      stampOverlay.classList.add('show');
      setTimeout(()=>stampOverlay.classList.remove('show'), 1900);
      $('noteInput').value = '';
      updateMyBadge();
    }catch(e){
      notifyH('error');
      setTxt('formErr', T().sendErr);
      formErr.classList.add('show');
    }finally{
      btn.disabled = false; btn.textContent = T().confirm;
    }
  });

  // ---- my reservations badge (виден только когда есть брони) ----
  function updateMyBadge(){
    const n = loadMy().length;
    const b = $('myBadge');
    if (!b) return;
    b.style.display = n > 0 ? 'flex' : 'none';
    setTxt('myBadgeN', String(n));
  }
  $('myBadge').addEventListener('click', ()=>{
    haptic('light');
    renderRequests();
    openSheet(requestsSheet);
  });

  // ================= admin panel =================
  async function adminApi(op, extra){
    if (!window.NOTIFY_WEBHOOK) return null;
    try{
      const res = await fetch(window.NOTIFY_WEBHOOK, {
        method:'POST',
        body: JSON.stringify(Object.assign({type:'admin', initData:(tg && tg.initData) || '', op}, extra || {})),
      });
      return await res.json();
    }catch(e){ return null; }
  }

  async function initAdmin(){
    if (!inTG) return;
    const r = await adminApi('whoami');
    if (r && r.ok && r.admin){
      isAdmin = true;
      $('adminBtn').style.display = 'flex';
    }
  }

  $('adminBtn').addEventListener('click', ()=>{
    haptic('light');
    renderAdminCars();
    openSheet(adminSheet);
  });

  $('tabCars').addEventListener('click', ()=>{
    $('tabCars').classList.add('active'); $('tabBookings').classList.remove('active');
    $('adminCars').style.display = ''; $('adminBookings').style.display = 'none';
    renderAdminCars();
  });
  $('tabBookings').addEventListener('click', ()=>{
    $('tabBookings').classList.add('active'); $('tabCars').classList.remove('active');
    $('adminBookings').style.display = ''; $('adminCars').style.display = 'none';
    renderAdminBookings();
  });

  function renderAdminCars(){
    const box = $('adminCars');
    if (!allCars.length){ box.innerHTML = '<div class="aloading">Нет машин</div>'; return; }
    box.innerHTML = allCars.map(c=>{
      const on = c.active !== false;
      const d = discountPct(c);
      return `
      <div class="acar ${on?'':'inactive'}" data-id="${esc(c.id)}">
        <div>
          <div class="an">${esc(c.name)}</div>
          <div class="as">${on?'✅ в каталоге':'🚫 скрыта'} · €${esc(c.priceperday)}/день${d?' (обычная €'+esc(c.baseprice)+', −'+d+'%)':''}</div>
        </div>
        <div class="acar-r">
          <button class="abtn" data-act="price">€</button>
          <button class="abtn ${on?'danger':'good'}" data-act="toggle">${on?'Скрыть':'Показать'}</button>
        </div>
      </div>
      <div class="aprice-row" data-price-for="${esc(c.id)}" style="display:none">
        <input type="number" min="1" max="9999" value="${esc(c.priceperday)}" placeholder="€/день" data-f="price">
        <input type="number" min="0" max="9999" value="${c.baseprice?esc(c.baseprice):''}" placeholder="обычная €" data-f="base">
        <button class="abtn good" data-act="save-price">OK</button>
      </div>`;
    }).join('');
  }

  $('adminCars').addEventListener('click', async e=>{
    const btn = e.target.closest('.abtn');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'toggle'){
      const row = btn.closest('.acar');
      const id = row.dataset.id;
      const car = allCars.find(c=>c.id===id);
      if (!car) return;
      const newActive = car.active === false;
      btn.disabled = true; btn.textContent = '…';
      const r = await adminApi('setActive', {carId:id, value:newActive});
      btn.disabled = false;
      if (r && r.ok){
        car.active = newActive;
        haptic('medium');
        cars = allCars.filter(c=>c.active!==false);
        if (current >= cars.length) current = Math.max(0, cars.length-1);
        renderDeck();
        renderAdminCars();
      } else {
        btn.textContent = 'Ошибка';
        notifyH('error');
      }
    }
    if (act === 'price'){
      const row = btn.closest('.acar');
      const pr = document.querySelector(`[data-price-for="${row.dataset.id}"]`);
      if (pr) pr.style.display = pr.style.display === 'none' ? 'flex' : 'none';
    }
    if (act === 'save-price'){
      const pr = btn.closest('.aprice-row');
      const id = pr.dataset.priceFor;
      const val = parseInt(pr.querySelector('input[data-f="price"]').value, 10);
      const base = parseInt(pr.querySelector('input[data-f="base"]').value, 10) || 0;
      if (!val || val < 1){ notifyH('error'); return; }
      btn.disabled = true; btn.textContent = '…';
      const r = await adminApi('setPrice', {carId:id, value:val});
      const r2 = await adminApi('setBase', {carId:id, value:base});
      btn.disabled = false; btn.textContent = 'OK';
      if (r && r.ok && r2 && r2.ok){
        const car = allCars.find(c=>c.id===id);
        if (car){ car.priceperday = val; if (base > 0) car.baseprice = base; else delete car.baseprice; }
        haptic('medium');
        pr.style.display = 'none';
        cars = allCars.filter(c=>c.active!==false);
        renderDeck();
        renderAdminCars();
      } else notifyH('error');
    }
  });

  async function renderAdminBookings(){
    const box = $('adminBookings');
    box.innerHTML = '<div class="aloading">Загружаем заявки…</div>';
    const r = await adminApi('bookings');
    if (!r || !r.ok){ box.innerHTML = '<div class="aloading">Не удалось загрузить</div>'; return; }
    if (!r.bookings.length){ box.innerHTML = '<div class="aloading">Заявок пока нет</div>'; return; }
    box.innerHTML = r.bookings.map(b=>`
      <div class="req-item">
        <div class="top">
          <div class="car">${esc(b.carName)}</div>
          <div class="when">${b.createdAt ? new Date(b.createdAt).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}) : ''} <span class="astatus new">${esc(b.status||'new')}</span></div>
        </div>
        <div class="meta">
          ${esc(b.from)} → ${esc(b.to)}${b.total?' · €'+esc(b.total):''}<br>
          ${esc(b.name)} · ${esc(b.phone)}${b.tgUser?' · @'+esc(b.tgUser):''}
          ${b.note ? '<br>«'+esc(b.note)+'»' : ''}
        </div>
      </div>`).join('');
  }

  function renderRequests(){
    const list = $('reqList');
    const items = loadMy();
    if (!items.length){ list.innerHTML = `<div class="req-empty">${T().reqEmpty}</div>`; return; }
    const locale = lang === 'ru' ? 'ru-RU' : (lang === 'es' ? 'es-ES' : 'en-GB');
    list.innerHTML = items.map(b=>`
      <div class="req-item">
        <div class="top">
          <div class="car">${esc(b.carName)}</div>
          <div class="when">${new Date(b.createdAt).toLocaleDateString(locale,{day:'2-digit',month:'short'})}</div>
        </div>
        <div class="meta">
          ${esc(b.from)} → ${esc(b.to)}${b.total ? ' · €'+esc(b.total) : ' · €'+esc(b.priceperday)+'/'+esc(T().day)}<br>
          ${esc(b.name)} · ${esc(b.phone)}
          ${b.note ? '<br>«'+esc(b.note)+'»' : ''}
        </div>
      </div>`).join('');
  }

  $('clearReq').addEventListener('click', ()=>{
    const doClear = () => { clearMy(); renderRequests(); updateMyBadge(); };
    if (tg && tg.showConfirm){
      try{ tg.showConfirm(T().clearAsk, ok => { if (ok) doClear(); }); return; }catch(e){}
    }
    if (confirm(T().clearAsk)) doClear();
  });

  // ================= onboarding hint =================
  const HINT_KEY = 'pas:hint-v2';
  function maybeShowHint(){
    try{ if (localStorage.getItem(HINT_KEY)) return; }catch(e){}
    $('hintOverlay').classList.add('show');
  }
  function dismissHint(){
    const h = $('hintOverlay');
    if (!h.classList.contains('show')) return;
    h.classList.remove('show');
    try{ localStorage.setItem(HINT_KEY,'1'); }catch(e){}
  }
  $('hintOk').addEventListener('click', dismissHint);
  $('hintOverlay').addEventListener('click', e=>{ if (e.target === e.currentTarget) dismissHint(); });

  // ================= language =================
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
    setTxt('loadingText', T().loading);
    setTxt('bookTitle', T().bookSheetTitle);
    setTxt('lblFrom', T().from);
    setTxt('lblTo', T().to);
    setTxt('lblName', T().name);
    setTxt('lblPhone', T().phone);
    setTxt('lblNote', T().note);
    const noteEl = $('noteInput'); if (noteEl) noteEl.placeholder = T().notePh;
    setTxt('confirmBtn', T().confirm);
    setTxt('reqTitle', T().reqTitle);
    setTxt('reqSub', T().reqSub);
    setTxt('clearReq', T().clear);
    setTxt('stampT1', T().ok1);
    setTxt('stampT2', T().ok2);
    setTxt('dateErr', T().dateErr);
    setTxt('formErr', T().formErr);
    setTxt('hintSwipe', T().hintSwipe);
    setTxt('hintTap', T().hintTap);
    setTxt('hintBook', T().hintBook);
    if (activeBookingCar){
      setBookPrice();
      updateTotal();
    } else {
      setTxt('totalLabel', T().total);
      document.querySelectorAll('.qd').forEach(b=>{ b.textContent = T().days(parseInt(b.dataset.d,10)); });
    }
    if (cars.length) renderDeck();
    if (requestsSheet.classList.contains('show')) renderRequests();
  }

  $('langSwitch').addEventListener('click', e=>{
    const b = e.target.closest('.lang-btn');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try{ localStorage.setItem(LANG_KEY, lang); }catch(e2){}
    haptic('light');
    applyLang();
  });

  // ================= keyboard (desktop) =================
  window.addEventListener('keydown', e=>{
    if (e.key === 'ArrowRight') goTo(current+1);
    if (e.key === 'ArrowLeft') goTo(current-1);
  });

  // ================= init =================
  applyTheme();
  applyLang();
  updateMyBadge();
  (async function init(){
    await loadFleet();
    renderDeck();
    maybeShowHint();
    initAdmin();
  })();

})();
</script>
</body>
</html>
